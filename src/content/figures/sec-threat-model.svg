<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Who can run code in your page?</title>
  <desc id="d">A browser tab for app.example.com contains five kinds of code that all share the same origin: your own code, npm packages bundled into it, third-party scripts such as analytics and chat widgets, user content that may be rendered as HTML, and browser extensions that can read the page. In another tab, an attacker site at evil.example can frame your page and send forged requests that carry the user&#x27;s cookies. On the right, your API server is outside the browser: it is the only place where authorisation and validation can be enforced, because every request reaching it may have been forged or edited.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Who can run code in your page?</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Everything in the tab shares one origin. The server is the only place you fully control.</text>
  <rect class="card" x="40" y="100" width="760" height="420" rx="16" stroke-width="1.5" />
  <rect class="sunk" x="40" y="100" width="760" height="44" rx="16" stroke-width="0" />
  <circle cx="66" cy="122" r="6" class="muted" opacity=".5"/>
  <circle cx="86" cy="122" r="6" class="muted" opacity=".5"/>
  <circle cx="106" cy="122" r="6" class="muted" opacity=".5"/>
  <rect class="card" x="140" y="110" width="320" height="26" rx="8" stroke-width="1" />
  <text x="156" y="128" text-anchor="start" class="ink mono" font-size="13" xml:space="preserve">🔒 https://app.example.com</text>
  <text x="64" y="172" text-anchor="start" class="muted head" font-size="12.5">ONE ORIGIN, MANY AUTHORS</text>
  <rect class="possoft" x="64" y="188" width="712" height="52" rx="10" stroke-width="1.5" />
  <text x="84" y="211" text-anchor="start" class="ink" font-size="15" font-weight="700">Your code</text>
  <text x="84" y="229" text-anchor="start" class="muted" font-size="12.5">components, services, state</text>
  <text x="756" y="220" text-anchor="end" class="posink" font-size="12.5" font-weight="700">trusted, reviewed</text>
  <rect class="heat" x="64" y="252" width="712" height="52" rx="10" stroke-width="1.5" />
  <text x="84" y="275" text-anchor="start" class="ink" font-size="15" font-weight="700">npm packages</text>
  <text x="84" y="293" text-anchor="start" class="muted" font-size="12.5">hundreds of transitive dependencies</text>
  <text x="756" y="284" text-anchor="end" class="heatink" font-size="12.5" font-weight="700">trusted by default</text>
  <rect class="heat" x="64" y="316" width="712" height="52" rx="10" stroke-width="1.5" />
  <text x="84" y="339" text-anchor="start" class="ink" font-size="15" font-weight="700">Third-party scripts</text>
  <text x="84" y="357" text-anchor="start" class="muted" font-size="12.5">analytics, ads, chat, A/B testing</text>
  <text x="756" y="348" text-anchor="end" class="heatink" font-size="12.5" font-weight="700">can change any time</text>
  <rect class="negsoft" x="64" y="380" width="712" height="52" rx="10" stroke-width="1.5" />
  <text x="84" y="403" text-anchor="start" class="ink" font-size="15" font-weight="700">User content</text>
  <text x="84" y="421" text-anchor="start" class="muted" font-size="12.5">comments, names, Markdown, URLs</text>
  <text x="756" y="412" text-anchor="end" class="negink" font-size="12.5" font-weight="700">untrusted: data only</text>
  <rect class="sunk" x="64" y="444" width="712" height="52" rx="10" stroke-width="1.5" />
  <text x="84" y="467" text-anchor="start" class="ink" font-size="15" font-weight="700">Browser extensions</text>
  <text x="84" y="485" text-anchor="start" class="muted" font-size="12.5">can read and change the DOM</text>
  <text x="756" y="476" text-anchor="end" class="muted" font-size="12.5" font-weight="700">outside your control</text>
  <rect class="negsoft" x="840" y="100" width="320" height="150" rx="14" stroke-width="1.5" />
  <text x="1000" y="132" text-anchor="middle" class="negink mono" font-size="16" font-weight="700" xml:space="preserve">evil.example</text>
  <text x="1000" y="158" text-anchor="middle" class="muted" font-size="12.5">another tab or a link</text>
  <text x="866" y="190" text-anchor="middle" class="negink" font-size="12.5" font-weight="700">✕</text>
  <text x="884" y="190" text-anchor="start" class="ink" font-size="12.5">frames your page (clickjacking)</text>
  <text x="866" y="212" text-anchor="middle" class="negink" font-size="12.5" font-weight="700">✕</text>
  <text x="884" y="212" text-anchor="start" class="ink" font-size="12.5">sends forged requests (CSRF)</text>
  <rect class="possoft" x="840" y="300" width="320" height="220" rx="12" stroke-width="1.5" />
  <text x="1000.0" y="379.5" text-anchor="middle" class="posink" font-size="15" font-weight="700">Your API server</text>
  <text x="1000.0" y="399.5" text-anchor="middle" class="muted" font-size="13">Enforce here:</text>
  <text x="1000.0" y="417.5" text-anchor="middle" class="muted" font-size="13">authentication</text>
  <text x="1000.0" y="435.5" text-anchor="middle" class="muted" font-size="13">authorisation</text>
  <text x="1000.0" y="453.5" text-anchor="middle" class="muted" font-size="13">validation &amp; rate limits</text>
  <line class="spos" x1="800" y1="410" x2="836" y2="410" marker-end="url(#ap)"/>
  <line class="sneg" x1="1000" y1="250" x2="1000" y2="296" stroke-dasharray="6 5" marker-end="url(#an)"/>
  <text x="1010" y="280" text-anchor="start" class="negink" font-size="12" font-weight="700">forged</text>
</svg>
