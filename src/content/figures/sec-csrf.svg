<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">CSRF: the browser brings the cookie</title>
  <desc id="d">Top row, the attack: a page on evil.example contains a hidden form that auto-submits a POST to bank.example/transfer. The browser attaches the user&#x27;s session cookie for bank.example, and the bank, seeing a valid session, performs the transfer. Bottom row, defended: the same forged POST arrives, but the cookie is SameSite=Lax so the browser does not attach it on a cross-site POST, and the request carries Sec-Fetch-Site: cross-site, which the server rejects; a CSRF token check would also fail because the attacker cannot read the token.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="520" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">CSRF: the browser brings the cookie</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Cookies are attached by destination, not by who started the request. SameSite and Fetch Metadata change that.</text>
  <text x="40" y="114" text-anchor="start" class="negink head" font-size="12.5">THE ATTACK</text>
  <rect class="negsoft" x="40" y="128" width="260" height="130" rx="12" stroke-width="1.5" />
  <text x="170.0" y="173.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">evil.example</text>
  <text x="170.0" y="192.25" text-anchor="middle" class="muted mono" font-size="11.5" xml:space="preserve">&lt;form method=&quot;POST&quot;</text>
  <text x="170.0" y="208.75" text-anchor="middle" class="muted mono" font-size="11.5" xml:space="preserve"> action=&quot;bank.example/transfer&quot;&gt;</text>
  <text x="170.0" y="225.25" text-anchor="middle" class="muted mono" font-size="11.5" xml:space="preserve">auto-submits</text>
  <line class="sneg" x1="302" y1="193" x2="376" y2="193" marker-end="url(#an)"/>
  <rect class="card" x="380" y="128" width="320" height="130" rx="12" stroke-width="1.5" />
  <text x="540.0" y="173.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Browser</text>
  <text x="540.0" y="192.0" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">POST /transfer</text>
  <text x="540.0" y="209.0" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">Cookie: session=7f3a…  (attached!)</text>
  <text x="540.0" y="226.0" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">Sec-Fetch-Site: cross-site</text>
  <line class="sneg" x1="702" y1="193" x2="776" y2="193" marker-end="url(#an)"/>
  <rect class="negsoft" x="780" y="128" width="380" height="130" rx="12" stroke-width="1.5" />
  <text x="970.0" y="189.5" text-anchor="middle" class="negink" font-size="15" font-weight="700">✕ bank.example: transfer done</text>
  <text x="970.0" y="209.5" text-anchor="middle" class="muted" font-size="13">valid session, so it looks legitimate</text>
  <text x="40" y="304" text-anchor="start" class="posink head" font-size="12.5">DEFENDED</text>
  <rect class="negsoft" x="40" y="318" width="260" height="130" rx="12" stroke-width="1.5" />
  <text x="170.0" y="363.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">evil.example</text>
  <text x="170.0" y="382.25" text-anchor="middle" class="muted mono" font-size="11.5" xml:space="preserve">&lt;form method=&quot;POST&quot;</text>
  <text x="170.0" y="398.75" text-anchor="middle" class="muted mono" font-size="11.5" xml:space="preserve"> action=&quot;bank.example/transfer&quot;&gt;</text>
  <text x="170.0" y="415.25" text-anchor="middle" class="muted mono" font-size="11.5" xml:space="preserve">auto-submits</text>
  <line class="sneg" x1="302" y1="383" x2="376" y2="383" marker-end="url(#an)"/>
  <rect class="card" x="380" y="318" width="320" height="130" rx="12" stroke-width="1.5" />
  <text x="540.0" y="363.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Browser</text>
  <text x="540.0" y="382.0" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">POST /transfer</text>
  <text x="540.0" y="399.0" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">no cookie (SameSite=Lax)</text>
  <text x="540.0" y="416.0" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">Sec-Fetch-Site: cross-site</text>
  <line class="spos" x1="702" y1="383" x2="776" y2="383" marker-end="url(#ap)"/>
  <rect class="possoft" x="780" y="318" width="380" height="130" rx="12" stroke-width="1.5" />
  <text x="970.0" y="371.0" text-anchor="middle" class="posink" font-size="15" font-weight="700">✓ bank.example: 403</text>
  <text x="970.0" y="390.5" text-anchor="middle" class="muted" font-size="12.5">no session · cross-site · no CSRF token</text>
  <text x="970.0" y="408.0" text-anchor="middle" class="muted" font-size="12.5">any one of these is enough to refuse</text>
</svg>
