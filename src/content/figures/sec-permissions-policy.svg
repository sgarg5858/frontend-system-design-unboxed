<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Permissions-Policy: features per frame</title>
  <desc id="d">A page at shop.example sends Permissions-Policy: camera=(), geolocation=(self), payment=(self &quot;https://pay.example&quot;). Inside the page, the shop&#x27;s own code can use geolocation and payment, but not the camera. An iframe from pay.example with allow=&quot;payment&quot; can use payment, because the header lists that origin and the attribute delegates it; it cannot use geolocation. An iframe from ads.example gets nothing: no camera, no geolocation, no payment, even if it asks.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="470" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Permissions-Policy: features per frame</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">The header sets the ceiling for the page. iframes get a feature only if the header and their allow attribute both permit it.</text>
  <rect class="hit" x="40" y="100" width="1120" height="70" rx="12" stroke-width="1.5" />
  <text x="60" y="130" text-anchor="start" class="accink mono" font-size="15" font-weight="700" xml:space="preserve">Permissions-Policy:</text>
  <text x="60" y="154" text-anchor="start" class="ink mono" font-size="14" xml:space="preserve">camera=(), geolocation=(self), payment=(self &quot;https://pay.example&quot;)</text>
  <rect class="card" x="40" y="190" width="1120" height="250" rx="16" stroke-width="1.5" />
  <text x="60" y="220" text-anchor="start" class="ink mono" font-size="15" font-weight="700" xml:space="preserve">shop.example (top-level page)</text>
  <rect class="sunk" x="64" y="240" width="340" height="180" rx="12" stroke-width="1.5" />
  <text x="84" y="272" text-anchor="start" class="ink" font-size="13.5" font-weight="700">Your own code</text>
  <text x="90" y="330" text-anchor="middle" class="posink" font-size="15" font-weight="700">✓</text>
  <text x="108" y="330" text-anchor="start" class="ink" font-size="15">geolocation</text>
  <text x="90" y="360" text-anchor="middle" class="posink" font-size="15" font-weight="700">✓</text>
  <text x="108" y="360" text-anchor="start" class="ink" font-size="15">payment</text>
  <text x="90" y="390" text-anchor="middle" class="negink" font-size="15" font-weight="700">✕</text>
  <text x="108" y="390" text-anchor="start" class="ink" font-size="15">camera</text>
  <rect class="possoft" x="429" y="240" width="340" height="180" rx="12" stroke-width="1.5" />
  <text x="449" y="272" text-anchor="start" class="ink mono" font-size="13.5" font-weight="700" xml:space="preserve">&lt;iframe src=&quot;pay.example&quot;</text>
  <text x="449" y="292" text-anchor="start" class="accink mono" font-size="13.5" font-weight="700" xml:space="preserve">allow=&quot;payment&quot;&gt;</text>
  <text x="455" y="330" text-anchor="middle" class="posink" font-size="15" font-weight="700">✓</text>
  <text x="473" y="330" text-anchor="start" class="ink" font-size="15">payment</text>
  <text x="455" y="360" text-anchor="middle" class="negink" font-size="15" font-weight="700">✕</text>
  <text x="473" y="360" text-anchor="start" class="ink" font-size="15">geolocation</text>
  <text x="455" y="390" text-anchor="middle" class="negink" font-size="15" font-weight="700">✕</text>
  <text x="473" y="390" text-anchor="start" class="ink" font-size="15">camera</text>
  <rect class="negsoft" x="794" y="240" width="340" height="180" rx="12" stroke-width="1.5" />
  <text x="814" y="272" text-anchor="start" class="ink mono" font-size="13.5" font-weight="700" xml:space="preserve">&lt;iframe src=&quot;ads.example&quot;&gt;</text>
  <text x="820" y="330" text-anchor="middle" class="negink" font-size="15" font-weight="700">✕</text>
  <text x="838" y="330" text-anchor="start" class="ink" font-size="15">payment</text>
  <text x="820" y="360" text-anchor="middle" class="negink" font-size="15" font-weight="700">✕</text>
  <text x="838" y="360" text-anchor="start" class="ink" font-size="15">geolocation</text>
  <text x="820" y="390" text-anchor="middle" class="negink" font-size="15" font-weight="700">✕</text>
  <text x="838" y="390" text-anchor="start" class="ink" font-size="15">camera</text>
</svg>
