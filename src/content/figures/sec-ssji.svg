<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">SSJI: user input becomes server code</title>
  <desc id="d">A request with ?expr=require(&quot;fs&quot;).readFileSync(&quot;.env&quot;) arrives at a Node server whose handler calls eval on the query parameter. The evaluated code runs with the process&#x27;s permissions, shown as four red boxes: the file system (read source and .env files), environment variables (database passwords and API keys), child_process (run shell commands), and the internal network. The fix: never evaluate input; use a real parser or a lookup table, and run Node with least privilege.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="500" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">SSJI: user input becomes server code</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Once input reaches eval, the attacker has everything your Node process has.</text>
  <rect class="heat" x="40" y="190" width="300" height="120" rx="12" stroke-width="1.5" />
  <text x="190.0" y="238.5" text-anchor="middle" class="heatink" font-size="15" font-weight="700">Request</text>
  <text x="190.0" y="257.5" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">/calc?expr=require(&quot;fs&quot;)</text>
  <text x="190.0" y="274.5" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">.readFileSync(&quot;.env&quot;)</text>
  <line class="sneg" x1="342" y1="250" x2="418" y2="250" marker-end="url(#an)"/>
  <rect class="negsoft" x="422" y="170" width="300" height="160" rx="12" stroke-width="1.5" />
  <text x="572.0" y="219.5" text-anchor="middle" class="negink" font-size="15" font-weight="700">Node handler</text>
  <text x="572.0" y="239.5" text-anchor="middle" class="muted" font-size="13">eval(req.query.expr)</text>
  <text x="572.0" y="257.5" text-anchor="middle" class="muted" font-size="13"></text>
  <text x="572.0" y="275.5" text-anchor="middle" class="muted" font-size="13">runs with the</text>
  <text x="572.0" y="293.5" text-anchor="middle" class="muted" font-size="13">process&#x27;s permissions</text>
  <rect class="negsoft" x="860" y="100" width="300" height="76" rx="12" stroke-width="1.5" />
  <text x="1010.0" y="134.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">File system</text>
  <text x="1010.0" y="154.25" text-anchor="middle" class="muted" font-size="12.5">read source, .env, keys</text>
  <line class="sneg" x1="724" y1="250" x2="856" y2="138" marker-end="url(#an)"/>
  <rect class="negsoft" x="860" y="192" width="300" height="76" rx="12" stroke-width="1.5" />
  <text x="1010.0" y="226.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">process.env</text>
  <text x="1010.0" y="246.25" text-anchor="middle" class="muted" font-size="12.5">DB passwords, API keys</text>
  <line class="sneg" x1="724" y1="250" x2="856" y2="230" marker-end="url(#an)"/>
  <rect class="negsoft" x="860" y="284" width="300" height="76" rx="12" stroke-width="1.5" />
  <text x="1010.0" y="318.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">child_process</text>
  <text x="1010.0" y="338.25" text-anchor="middle" class="muted" font-size="12.5">run shell commands</text>
  <line class="sneg" x1="724" y1="250" x2="856" y2="322" marker-end="url(#an)"/>
  <rect class="negsoft" x="860" y="376" width="300" height="76" rx="12" stroke-width="1.5" />
  <text x="1010.0" y="410.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">Internal network</text>
  <text x="1010.0" y="430.25" text-anchor="middle" class="muted" font-size="12.5">pivot to other services</text>
  <line class="sneg" x1="724" y1="250" x2="856" y2="414" marker-end="url(#an)"/>
  <rect class="possoft" x="40" y="400" width="682" height="64" rx="12" stroke-width="1.5" />
  <text x="60" y="428" text-anchor="start" class="posink" font-size="13.5" font-weight="700">Fix: never eval input. Use a parser (e.g. mathjs) or a lookup table;</text>
  <text x="60" y="450" text-anchor="start" class="posink" font-size="13.5" font-weight="700">run with --permission and least privilege. vm is not a sandbox.</text>
</svg>
