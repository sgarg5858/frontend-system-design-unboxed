<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Why HTTPS needs HSTS</title>
  <desc id="d">Two rows. Without HSTS: the user types bank.example, the browser sends http://bank.example over café Wi-Fi, an attacker on the network intercepts it and keeps the user on a plain-HTTP copy of the site (SSL stripping), reading passwords and cookies. With HSTS: the browser remembers, or has preloaded, that bank.example is HTTPS-only, upgrades the request internally before anything is sent, and connects with TLS; the attacker sees only encrypted traffic, and certificate errors cannot be clicked through.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="470" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Why HTTPS needs HSTS</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Without HSTS, the first plain-HTTP request can be hijacked before the redirect to HTTPS ever happens.</text>
  <text x="40" y="116" text-anchor="start" class="negink head" font-size="12.5">WITHOUT HSTS</text>
  <rect class="card" x="40" y="130" width="200" height="100" rx="12" stroke-width="1.5" />
  <text x="140.0" y="176.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">User types</text>
  <text x="140.0" y="197.0" text-anchor="middle" class="muted mono" font-size="14" xml:space="preserve">bank.example</text>
  <line class="sneg" x1="242" y1="180" x2="318" y2="180" marker-end="url(#an)"/>
  <text x="280" y="168" text-anchor="middle" class="negink mono" font-size="12" font-weight="700" xml:space="preserve">http://</text>
  <rect class="negsoft" x="322" y="130" width="260" height="100" rx="12" stroke-width="1.5" />
  <text x="452.0" y="168.0" text-anchor="middle" class="negink" font-size="15" font-weight="700">Attacker on café Wi-Fi</text>
  <text x="452.0" y="187.5" text-anchor="middle" class="muted" font-size="12.5">intercepts plain HTTP</text>
  <text x="452.0" y="205.0" text-anchor="middle" class="muted" font-size="12.5">keeps you on http://</text>
  <line class="sneg" x1="584" y1="180" x2="658" y2="180" marker-end="url(#an)"/>
  <rect class="card" x="662" y="130" width="220" height="100" rx="12" stroke-width="1.5" />
  <text x="772.0" y="176.75" text-anchor="middle" class="ink" font-size="15" font-weight="700">bank.example</text>
  <text x="772.0" y="196.25" text-anchor="middle" class="muted" font-size="12.5">talks to the attacker</text>
  <rect class="negsoft" x="912" y="130" width="248" height="100" rx="12" stroke-width="1.5" />
  <text x="1036.0" y="176.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">✕ Passwords &amp; cookies</text>
  <text x="1036.0" y="196.25" text-anchor="middle" class="muted" font-size="12.5">readable and editable</text>
  <text x="40" y="286" text-anchor="start" class="posink head" font-size="12.5">WITH HSTS (OR PRELOADED)</text>
  <rect class="card" x="40" y="300" width="200" height="100" rx="12" stroke-width="1.5" />
  <text x="140.0" y="346.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">User types</text>
  <text x="140.0" y="367.0" text-anchor="middle" class="muted mono" font-size="14" xml:space="preserve">bank.example</text>
  <line class="spos" x1="242" y1="350" x2="318" y2="350" marker-end="url(#ap)"/>
  <rect class="possoft" x="322" y="300" width="260" height="100" rx="12" stroke-width="1.5" />
  <text x="452.0" y="338.0" text-anchor="middle" class="posink" font-size="15" font-weight="700">Browser upgrades first</text>
  <text x="452.0" y="357.5" text-anchor="middle" class="muted" font-size="12.5">307 Internal Redirect</text>
  <text x="452.0" y="375.0" text-anchor="middle" class="muted" font-size="12.5">→ https:// before sending</text>
  <line class="spos" x1="584" y1="350" x2="658" y2="350" marker-end="url(#ap)"/>
  <rect class="card" x="662" y="300" width="220" height="100" rx="12" stroke-width="1.5" />
  <text x="772.0" y="346.75" text-anchor="middle" class="ink" font-size="15" font-weight="700">TLS to bank.example</text>
  <text x="772.0" y="366.25" text-anchor="middle" class="muted" font-size="12.5">certificate checked</text>
  <rect class="possoft" x="912" y="300" width="248" height="100" rx="12" stroke-width="1.5" />
  <text x="1036.0" y="347.0" text-anchor="middle" class="posink" font-size="15" font-weight="700">✓ Attacker sees noise</text>
  <text x="1036.0" y="366.0" text-anchor="middle" class="muted" font-size="12">no click-through on cert errors</text>
  <text x="40" y="450" text-anchor="start" class="muted mono" font-size="13" xml:space="preserve">Strict-Transport-Security: max-age=63072000; includeSubDomains; preload</text>
</svg>
