<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">How CSP directives fall back</title>
  <desc id="d">default-src sits at the top as the fallback. Under it are fetch directives, each controlling one kind of resource: script-src for JavaScript, style-src for CSS, img-src for images, connect-src for fetch, XHR and WebSockets, font-src for fonts, media-src for audio and video, and frame-src for iframes you embed. If a directive is missing, the browser uses default-src. A second group does not fall back to default-src at all: frame-ancestors (who may frame you), form-action (where forms may submit), base-uri (what the base tag may be) and upgrade-insecure-requests. Example: with default-src self and img-src self https://images.example, images may come from the image CDN, but a script from that CDN is still blocked because script-src falls back to default-src self.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">How CSP directives fall back</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Each resource type has its own directive. If you leave one out, the browser uses default-src instead.</text>
  <rect class="hit" x="470" y="100" width="260" height="80" rx="12" stroke-width="1.5" />
  <text x="600.0" y="137.5" text-anchor="middle" class="accink" font-size="16" font-weight="700">default-src &#x27;self&#x27;</text>
  <text x="600.0" y="156.5" text-anchor="middle" class="muted" font-size="12">fallback for every fetch directive</text>
  <rect class="card" x="40" y="240" width="148" height="80" rx="12" stroke-width="1.5" />
  <text x="114.0" y="276.75" text-anchor="middle" class="ink" font-size="14" font-weight="700">script-src</text>
  <text x="114.0" y="295.25" text-anchor="middle" class="muted" font-size="11.5">JavaScript</text>
  <path class="thin" d="M600 182 C600 210 114 210 114 236" marker-end="url(#a)"/>
  <rect class="card" x="202" y="240" width="148" height="80" rx="12" stroke-width="1.5" />
  <text x="276.0" y="276.75" text-anchor="middle" class="ink" font-size="14" font-weight="700">style-src</text>
  <text x="276.0" y="295.25" text-anchor="middle" class="muted" font-size="11.5">CSS</text>
  <path class="thin" d="M600 182 C600 210 276 210 276 236" marker-end="url(#a)"/>
  <rect class="card" x="364" y="240" width="148" height="80" rx="12" stroke-width="1.5" />
  <text x="438.0" y="276.75" text-anchor="middle" class="ink" font-size="14" font-weight="700">img-src</text>
  <text x="438.0" y="295.25" text-anchor="middle" class="muted" font-size="11.5">images</text>
  <path class="thin" d="M600 182 C600 210 438 210 438 236" marker-end="url(#a)"/>
  <rect class="card" x="526" y="240" width="148" height="80" rx="12" stroke-width="1.5" />
  <text x="600.0" y="276.75" text-anchor="middle" class="ink" font-size="14" font-weight="700">connect-src</text>
  <text x="600.0" y="295.25" text-anchor="middle" class="muted" font-size="11.5">fetch · XHR · WebSocket</text>
  <path class="thin" d="M600 182 C600 210 600 210 600 236" marker-end="url(#a)"/>
  <rect class="card" x="688" y="240" width="148" height="80" rx="12" stroke-width="1.5" />
  <text x="762.0" y="276.75" text-anchor="middle" class="ink" font-size="14" font-weight="700">font-src</text>
  <text x="762.0" y="295.25" text-anchor="middle" class="muted" font-size="11.5">fonts</text>
  <path class="thin" d="M600 182 C600 210 762 210 762 236" marker-end="url(#a)"/>
  <rect class="card" x="850" y="240" width="148" height="80" rx="12" stroke-width="1.5" />
  <text x="924.0" y="276.75" text-anchor="middle" class="ink" font-size="14" font-weight="700">media-src</text>
  <text x="924.0" y="295.25" text-anchor="middle" class="muted" font-size="11.5">audio · video</text>
  <path class="thin" d="M600 182 C600 210 924 210 924 236" marker-end="url(#a)"/>
  <rect class="card" x="1012" y="240" width="148" height="80" rx="12" stroke-width="1.5" />
  <text x="1086.0" y="276.75" text-anchor="middle" class="ink" font-size="14" font-weight="700">frame-src</text>
  <text x="1086.0" y="295.25" text-anchor="middle" class="muted" font-size="11.5">iframes you embed</text>
  <path class="thin" d="M600 182 C600 210 1086 210 1086 236" marker-end="url(#a)"/>
  <text x="600" y="222" text-anchor="middle" class="muted" font-size="12" font-style="italic">used when a directive is missing</text>
  <rect class="sunk" x="40" y="350" width="1120" height="110" rx="14" stroke-width="0" />
  <text x="60" y="380" text-anchor="start" class="ink" font-size="14.5" font-weight="700">Never fall back to default-src: set them explicitly</text>
  <rect class="card" x="60" y="411.5" width="192.5" height="24.5" rx="12.25" stroke-width="1.2" />
  <text x="156.25" y="429" text-anchor="middle" class="ink mono" font-size="12.5" font-weight="700" xml:space="preserve">frame-ancestors &#x27;none&#x27;</text>
  <text x="64" y="450" text-anchor="start" class="muted" font-size="12">who may frame you</text>
  <rect class="card" x="335" y="411.5" width="161.5" height="24.5" rx="12.25" stroke-width="1.2" />
  <text x="415.75" y="429" text-anchor="middle" class="ink mono" font-size="12.5" font-weight="700" xml:space="preserve">form-action &#x27;self&#x27;</text>
  <text x="339" y="450" text-anchor="start" class="muted" font-size="12">where forms may submit</text>
  <rect class="card" x="610" y="411.5" width="138.25" height="24.5" rx="12.25" stroke-width="1.2" />
  <text x="679.125" y="429" text-anchor="middle" class="ink mono" font-size="12.5" font-weight="700" xml:space="preserve">base-uri &#x27;none&#x27;</text>
  <text x="614" y="450" text-anchor="start" class="muted" font-size="12">stops &lt;base&gt; hijacking</text>
  <rect class="card" x="885" y="411.5" width="215.75" height="24.5" rx="12.25" stroke-width="1.2" />
  <text x="992.875" y="429" text-anchor="middle" class="ink mono" font-size="12.5" font-weight="700" xml:space="preserve">upgrade-insecure-requests</text>
  <text x="889" y="450" text-anchor="start" class="muted" font-size="12">http → https</text>
  <text x="40" y="500" text-anchor="start" class="ink mono" font-size="13.5" xml:space="preserve">Example: default-src &#x27;self&#x27;; img-src &#x27;self&#x27; https://images.example</text>
  <text x="40" y="524" text-anchor="start" class="muted" font-size="13">→ images from images.example load; a script from images.example is still blocked (script-src falls back to &#x27;self&#x27;).</text>
</svg>
