<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Origin = scheme + host + port</title>
  <desc id="d">The URL https://app.example.com:443/settings is split into its parts. The scheme https, the host app.example.com and the port 443 together form the origin; the path /settings is not part of it. Below, two lists show what the same-origin policy does. A page can send: form posts to any origin, fetch requests to any origin, and embed images, scripts, styles and iframes from anywhere. It cannot read: a cross-origin fetch response unless the server allows it with CORS, another origin&#x27;s cookies or localStorage, or the DOM inside a cross-origin iframe.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="540" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Origin = scheme + host + port</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">The same-origin policy lets a page send almost anything, but only read responses from its own origin.</text>
  <rect class="hit" x="170" y="108" width="180" height="58" rx="10" stroke-width="1.5" />
  <text x="260.0" y="147" text-anchor="middle" class="accink mono" font-size="32" font-weight="700" xml:space="preserve">https://</text>
  <text x="260.0" y="190" text-anchor="middle" class="accink head" font-size="12">SCHEME</text>
  <rect class="hit" x="360" y="108" width="313" height="58" rx="10" stroke-width="1.5" />
  <text x="516.5" y="147" text-anchor="middle" class="accink mono" font-size="32" font-weight="700" xml:space="preserve">app.example.com</text>
  <text x="516.5" y="190" text-anchor="middle" class="accink head" font-size="12">HOST</text>
  <rect class="hit" x="683" y="108" width="104" height="58" rx="10" stroke-width="1.5" />
  <text x="735.0" y="147" text-anchor="middle" class="accink mono" font-size="32" font-weight="700" xml:space="preserve">:443</text>
  <text x="735.0" y="190" text-anchor="middle" class="accink head" font-size="12">PORT</text>
  <rect class="sunk" x="797" y="108" width="199" height="58" rx="10" stroke-width="1.5" />
  <text x="896.5" y="147" text-anchor="middle" class="muted mono" font-size="32" font-weight="700" xml:space="preserve">/settings</text>
  <text x="896.5" y="190" text-anchor="middle" class="muted head" font-size="12">PATH: not part of the origin</text>
  <path class="sacc" d="M170 204 v10 h617 v-10"/>
  <text x="478.5" y="236" text-anchor="middle" class="accink" font-size="14" font-weight="700">the origin</text>
  <rect class="possoft" x="40" y="262" width="550" height="250" rx="14" stroke-width="1.5" />
  <text x="64" y="292" text-anchor="start" class="posink head" font-size="12.5">CAN SEND (WRITES &amp; EMBEDS)</text>
  <text x="66" y="326" text-anchor="middle" class="posink" font-size="14" font-weight="700">✓</text>
  <text x="84" y="326" text-anchor="start" class="ink" font-size="14">POST a form to any origin</text>
  <text x="66" y="354" text-anchor="middle" class="posink" font-size="14" font-weight="700">✓</text>
  <text x="84" y="354" text-anchor="start" class="ink" font-size="14">fetch() a request to any origin</text>
  <text x="66" y="382" text-anchor="middle" class="posink" font-size="14" font-weight="700">✓</text>
  <text x="84" y="382" text-anchor="start" class="ink" font-size="14">embed &lt;img&gt;, &lt;script&gt;, &lt;link&gt;, &lt;iframe&gt;</text>
  <text x="66" y="410" text-anchor="middle" class="posink" font-size="14" font-weight="700">✓</text>
  <text x="84" y="410" text-anchor="start" class="ink" font-size="14">navigate or open a window anywhere</text>
  <text x="66" y="470" text-anchor="start" class="posink" font-size="13.5" font-weight="700">This gap is why CSRF exists.</text>
  <rect class="negsoft" x="610" y="262" width="550" height="250" rx="14" stroke-width="1.5" />
  <text x="634" y="292" text-anchor="start" class="negink head" font-size="12.5">CAN&#x27;T READ (WITHOUT PERMISSION)</text>
  <text x="636" y="326" text-anchor="middle" class="negink" font-size="14" font-weight="700">✕</text>
  <text x="654" y="326" text-anchor="start" class="ink" font-size="14">a cross-origin fetch response</text>
  <text x="636" y="354" text-anchor="middle" class="negink" font-size="14" font-weight="700">✕</text>
  <text x="654" y="354" text-anchor="start" class="ink" font-size="14">another origin&#x27;s cookies or localStorage</text>
  <text x="636" y="382" text-anchor="middle" class="negink" font-size="14" font-weight="700">✕</text>
  <text x="654" y="382" text-anchor="start" class="ink" font-size="14">the DOM of a cross-origin iframe</text>
  <text x="636" y="410" text-anchor="middle" class="negink" font-size="14" font-weight="700">✕</text>
  <text x="654" y="410" text-anchor="start" class="ink" font-size="14">pixels of a cross-origin image on a canvas</text>
  <text x="636" y="470" text-anchor="start" class="negink" font-size="13.5" font-weight="700">CORS is how a server grants read access.</text>
</svg>
