<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Wiz: connecting a CVE in code to real exposure in the cloud</title>
  <desc id="d">A graph from left to right. In code: a repository with a vulnerable package in package-lock.json, found by Wiz Code scanning the repo and pull requests, along with secrets and infrastructure-as-code misconfigurations. It builds into a container image, scanned in CI and the registry. The image runs as an SSR Node service in Kubernetes, which Wiz Cloud scans agentlessly. That service is exposed to the internet and its role can read a storage bucket with customer data. Wiz&#x27;s security graph links these facts and flags the toxic combination: vulnerable, exposed, and with access to sensitive data, which should be fixed first. The same CVE in an internal batch job with no data access ranks much lower. Google completed its acquisition of Wiz in March 2026; Wiz still supports all major clouds.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Wiz: connecting a CVE in code to real exposure in the cloud</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">The same vulnerable package matters far more when it is deployed, internet-facing and holds secrets.</text>
  <rect class="card" x="40" y="130" width="220" height="140" rx="12" stroke-width="1.5" />
  <text x="150.0" y="180.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Repo (Wiz Code)</text>
  <text x="150.0" y="199.0" text-anchor="middle" class="muted" font-size="12">lockfile: vulnerable pkg</text>
  <text x="150.0" y="216.0" text-anchor="middle" class="muted" font-size="12">secrets · IaC · SAST</text>
  <text x="150.0" y="233.0" text-anchor="middle" class="muted" font-size="12">PR + IDE scanning</text>
  <rect class="card" x="290" y="130" width="220" height="140" rx="12" stroke-width="1.5" />
  <text x="400.0" y="188.5" text-anchor="middle" class="ink" font-size="15" font-weight="700">Container image</text>
  <text x="400.0" y="207.5" text-anchor="middle" class="muted" font-size="12">built in CI</text>
  <text x="400.0" y="224.5" text-anchor="middle" class="muted" font-size="12">scanned in registry</text>
  <rect class="card" x="540" y="130" width="220" height="140" rx="12" stroke-width="1.5" />
  <text x="650.0" y="188.5" text-anchor="middle" class="ink" font-size="15" font-weight="700">SSR service (Node)</text>
  <text x="650.0" y="207.5" text-anchor="middle" class="muted" font-size="12">running in Kubernetes</text>
  <text x="650.0" y="224.5" text-anchor="middle" class="muted" font-size="12">Wiz Cloud: agentless scan</text>
  <line class="line" x1="262" y1="200" x2="286" y2="200" marker-end="url(#a)"/>
  <line class="line" x1="512" y1="200" x2="536" y2="200" marker-end="url(#a)"/>
  <rect class="negsoft" x="820" y="100" width="340" height="90" rx="12" stroke-width="1.5" />
  <text x="990.0" y="141.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">Exposed to the internet</text>
  <text x="990.0" y="161.25" text-anchor="middle" class="muted" font-size="12.5">public load balancer</text>
  <rect class="negsoft" x="820" y="210" width="340" height="90" rx="12" stroke-width="1.5" />
  <text x="990.0" y="251.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">Role can read customer data</text>
  <text x="990.0" y="271.25" text-anchor="middle" class="muted" font-size="12.5">storage bucket with PII</text>
  <line class="sneg" x1="762" y1="180" x2="816" y2="150" marker-end="url(#an)"/>
  <line class="sneg" x1="762" y1="220" x2="816" y2="250" marker-end="url(#an)"/>
  <rect class="negsoft" x="40" y="330" width="1120" height="100" rx="14" stroke-width="1.5" />
  <text x="600" y="368" text-anchor="middle" class="negink" font-size="18" font-weight="700">Toxic combination: vulnerable + exposed + sensitive data access</text>
  <text x="600" y="398" text-anchor="middle" class="ink" font-size="14">Wiz Security Graph ranks this attack path first and points to the repo and owner that can fix it.</text>
  <rect class="sunk" x="40" y="450" width="1120" height="70" rx="12" stroke-width="0" />
  <text x="600" y="482" text-anchor="middle" class="muted" font-size="14">Same CVE in an internal batch job with no data access: still fix it, but it is not today&#x27;s emergency.</text>
  <text x="600" y="504" text-anchor="middle" class="muted" font-size="12.5">Similar platforms (CNAPP): Palo Alto Prisma Cloud, Orca, Microsoft Defender for Cloud, Aqua.</text>
</svg>
