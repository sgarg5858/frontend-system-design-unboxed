<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Small, frequent updates vs one big upgrade</title>
  <desc id="d">Two teams receive the same critical security fix, released only in the newest major version of a framework. Team A updates every week: it is one patch behind, so it applies the fix in a small pull request the same day. Team B updates once a year: it is three major versions behind, so to get the fix it must first work through three sets of breaking changes and peer-dependency conflicts, which takes weeks while the vulnerability stays exploitable. Old majors also leave their support window and stop getting fixes at all.</desc>
  <!--theme-->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="520" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Small, frequent updates vs one big upgrade</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Security fixes ship on the latest versions. The further behind you are, the longer an emergency fix takes.</text>
  <text x="40" y="116" text-anchor="start" class="posink head" font-size="12.5">TEAM A: UPDATES WEEKLY</text>
  <rect class="sunk" x="40" y="132" width="130" height="56" rx="10" stroke-width="1.5" />
  <text x="105" y="166" text-anchor="middle" class="ink mono" font-size="16" font-weight="700" xml:space="preserve">v19</text>
  <rect class="sunk" x="190" y="132" width="130" height="56" rx="10" stroke-width="1.5" />
  <text x="255" y="166" text-anchor="middle" class="ink mono" font-size="16" font-weight="700" xml:space="preserve">v20</text>
  <rect class="sunk" x="340" y="132" width="130" height="56" rx="10" stroke-width="1.5" />
  <text x="405" y="166" text-anchor="middle" class="ink mono" font-size="16" font-weight="700" xml:space="preserve">v21</text>
  <rect class="possoft" x="490" y="132" width="130" height="56" rx="10" stroke-width="1.5" />
  <text x="555" y="166" text-anchor="middle" class="ink mono" font-size="16" font-weight="700" xml:space="preserve">v22.2.5</text>
  <text x="555" y="210" text-anchor="middle" class="posink" font-size="12.5" font-weight="700">you are here</text>
  <rect class="hit" x="640" y="132" width="130" height="56" rx="10" stroke-width="1.5" />
  <text x="705" y="166" text-anchor="middle" class="accink mono" font-size="16" font-weight="700" xml:space="preserve">v22.2.6</text>
  <text x="705" y="210" text-anchor="middle" class="accink" font-size="12.5" font-weight="700">fix lands here</text>
  <path class="spos" d="M620 160 L636 160" marker-end="url(#ap)"/>
  <rect class="possoft" x="800" y="126" width="360" height="110" rx="12" stroke-width="1.5" />
  <text x="980.0" y="177.5" text-anchor="middle" class="posink" font-size="15" font-weight="700">1 small PR, same day</text>
  <text x="980.0" y="197.5" text-anchor="middle" class="muted" font-size="13">patch bump · tests pass · ship</text>
  <text x="40" y="306" text-anchor="start" class="negink head" font-size="12.5">TEAM B: UPDATES ONCE A YEAR</text>
  <rect class="negsoft" x="40" y="322" width="130" height="56" rx="10" stroke-width="1.5" />
  <text x="105" y="356" text-anchor="middle" class="ink mono" font-size="16" font-weight="700" xml:space="preserve">v19</text>
  <text x="105" y="400" text-anchor="middle" class="negink" font-size="12.5" font-weight="700">you are here</text>
  <rect class="sunk" x="190" y="322" width="130" height="56" rx="10" stroke-width="1.5" />
  <text x="255" y="356" text-anchor="middle" class="ink mono" font-size="16" font-weight="700" xml:space="preserve">v20</text>
  <rect class="sunk" x="340" y="322" width="130" height="56" rx="10" stroke-width="1.5" />
  <text x="405" y="356" text-anchor="middle" class="ink mono" font-size="16" font-weight="700" xml:space="preserve">v21</text>
  <rect class="sunk" x="490" y="322" width="130" height="56" rx="10" stroke-width="1.5" />
  <text x="555" y="356" text-anchor="middle" class="ink mono" font-size="16" font-weight="700" xml:space="preserve">v22.2.5</text>
  <rect class="hit" x="640" y="322" width="130" height="56" rx="10" stroke-width="1.5" />
  <text x="705" y="356" text-anchor="middle" class="accink mono" font-size="16" font-weight="700" xml:space="preserve">v22.2.6</text>
  <text x="705" y="400" text-anchor="middle" class="accink" font-size="12.5" font-weight="700">fix lands here</text>
  <path class="sneg" d="M170 350 L186 350" marker-end="url(#an)"/>
  <path class="sneg" d="M320 350 L336 350" marker-end="url(#an)"/>
  <path class="sneg" d="M470 350 L486 350" marker-end="url(#an)"/>
  <path class="sneg" d="M620 350 L636 350" marker-end="url(#an)"/>
  <rect class="negsoft" x="800" y="316" width="360" height="110" rx="12" stroke-width="1.5" />
  <text x="980.0" y="358.5" text-anchor="middle" class="negink" font-size="15" font-weight="700">3 majors of breaking changes</text>
  <text x="980.0" y="378.5" text-anchor="middle" class="muted" font-size="13">peer-dependency conflicts, migrations,</text>
  <text x="980.0" y="396.5" text-anchor="middle" class="muted" font-size="13">regressions: weeks while still exposed</text>
  <text x="40" y="500" text-anchor="start" class="muted" font-size="13">Angular supports each major for 18 months; Node LTS lines for 30 months. After that, no security fixes.</text>
</svg>
