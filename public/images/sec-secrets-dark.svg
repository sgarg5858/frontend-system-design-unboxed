<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Secret keys belong on a server</title>
  <desc id="d">Two designs. Wrong: the browser bundle contains a secret API key, sk-live-…, and calls the third-party API directly; anyone can open DevTools, copy the key and use it for their own requests, running up your bill or reading your data. Right: the browser calls your own endpoint /api/summary with its session cookie; your server checks the user is allowed, applies rate limits, adds the secret key from an environment variable and calls the third-party API. The key never leaves the server.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="520" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Secret keys belong on a server</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Anything in the bundle can be read in DevTools. Put a thin server in between that adds the key.</text>
  <text x="40" y="120" text-anchor="start" class="negink head" font-size="12.5">✕ KEY IN THE BUNDLE</text>
  <rect class="negsoft" x="40" y="136" width="520" height="340" rx="14" stroke-width="1.5" />
  <rect class="card" x="70" y="170" width="200" height="110" rx="12" stroke-width="1.5" />
  <text x="170.0" y="213.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Browser</text>
  <text x="170.0" y="232.5" text-anchor="middle" class="muted mono" font-size="12.5" xml:space="preserve">main.js contains</text>
  <text x="170.0" y="250.0" text-anchor="middle" class="muted mono" font-size="12.5" xml:space="preserve">sk-live-9f2c…</text>
  <line class="sneg" x1="272" y1="225" x2="338" y2="225" marker-end="url(#an)"/>
  <rect class="card" x="342" y="170" width="190" height="110" rx="12" stroke-width="1.5" />
  <text x="437.0" y="221.75" text-anchor="middle" class="ink" font-size="15" font-weight="700">Third-party API</text>
  <text x="437.0" y="241.25" text-anchor="middle" class="muted" font-size="12.5">trusts the key</text>
  <rect class="card" x="70" y="330" width="462" height="110" rx="12" stroke-width="1.5" />
  <text x="301.0" y="372.5" text-anchor="middle" class="negink" font-size="15" font-weight="700">Anyone with DevTools</text>
  <text x="301.0" y="392.5" text-anchor="middle" class="muted" font-size="13">Sources → search &quot;sk-&quot; → copy key</text>
  <text x="301.0" y="410.5" text-anchor="middle" class="muted" font-size="13">uses your quota and your data</text>
  <line class="sneg" x1="170" y1="282" x2="170" y2="326" stroke-dasharray="6 5" marker-end="url(#an)"/>
  <text x="620" y="120" text-anchor="start" class="posink head" font-size="12.5">✓ KEY ON YOUR SERVER</text>
  <rect class="possoft" x="620" y="136" width="540" height="340" rx="14" stroke-width="1.5" />
  <rect class="card" x="650" y="170" width="150" height="120" rx="12" stroke-width="1.5" />
  <text x="725.0" y="218.5" text-anchor="middle" class="ink" font-size="15" font-weight="700">Browser</text>
  <text x="725.0" y="237.5" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">fetch(&#x27;/api/…&#x27;)</text>
  <text x="725.0" y="254.5" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">session cookie</text>
  <line class="spos" x1="802" y1="230" x2="838" y2="230" marker-end="url(#ap)"/>
  <rect class="card" x="842" y="160" width="150" height="140" rx="12" stroke-width="1.5" />
  <text x="917.0" y="209.25" text-anchor="middle" class="ink" font-size="15" font-weight="700">Your server</text>
  <text x="917.0" y="228.75" text-anchor="middle" class="muted" font-size="12.5">checks the user</text>
  <text x="917.0" y="246.25" text-anchor="middle" class="muted" font-size="12.5">rate-limits</text>
  <text x="917.0" y="263.75" text-anchor="middle" class="muted" font-size="12.5">adds the key</text>
  <line class="spos" x1="994" y1="230" x2="1010" y2="230" marker-end="url(#ap)"/>
  <rect class="card" x="1014" y="170" width="126" height="120" rx="12" stroke-width="1.5" />
  <text x="1077.0" y="226.75" text-anchor="middle" class="ink" font-size="15" font-weight="700">Third-party</text>
  <text x="1077.0" y="246.25" text-anchor="middle" class="muted" font-size="12.5">API</text>
  <rect class="sunk" x="842" y="330" width="298" height="60" rx="10" stroke-width="1.5" />
  <text x="991" y="366" text-anchor="middle" class="ink mono" font-size="14" font-weight="700" xml:space="preserve">process.env.API_KEY</text>
  <line class="line" x1="917" y1="328" x2="917" y2="304" marker-end="url(#a)"/>
  <text x="890" y="440" text-anchor="middle" class="posink" font-size="12.5" font-weight="700">Publishable keys (maps, Stripe pk_…) are fine in the bundle.</text>
</svg>
