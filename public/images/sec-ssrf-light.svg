<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">SSRF: borrowing your server&#x27;s network position</title>
  <desc id="d">On the left, on the internet, an attacker cannot reach internal systems directly: a firewall blocks them. Instead they call your link-preview endpoint with url=http://169.254.169.254/latest/meta-data/. Your server, inside the private network, fetches that URL. From there it can reach the cloud metadata service, which can return credentials, an internal admin panel at 10.0.0.5 and a Redis database on localhost. The response comes back to the attacker as the &quot;preview&quot;.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="520" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">SSRF: borrowing your server&#x27;s network position</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">The firewall stops the attacker. It doesn&#x27;t stop your own server fetching a URL the attacker chose.</text>
  <rect class="negsoft" x="40" y="200" width="230" height="130" rx="12" stroke-width="1.5" />
  <text x="155.0" y="253.5" text-anchor="middle" class="negink" font-size="15" font-weight="700">Attacker</text>
  <text x="155.0" y="272.5" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">POST /preview</text>
  <text x="155.0" y="289.5" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">url=http://169.254…</text>
  <rect class="heatfill" x="300" y="100" width="18" height="400" rx="4" stroke-width="0" />
  <rect class="bg" x="300" y="214" width="18" height="100" rx="0" stroke-width="0" />
  <text x="309" y="96" text-anchor="middle" class="heatink head" font-size="11">FIREWALL</text>
  <text x="309" y="332" text-anchor="middle" class="heatink" font-size="11" font-weight="700">:443 open</text>
  <rect class="sunk" x="350" y="100" width="810" height="400" rx="16" stroke-width="0" />
  <text x="370" y="128" text-anchor="start" class="muted" font-size="13" font-weight="700">Your private network (VPC)</text>
  <rect class="card" x="400" y="200" width="260" height="120" rx="12" stroke-width="1.5" />
  <text x="530.0" y="248.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Your server</text>
  <text x="530.0" y="267.5" text-anchor="middle" class="muted mono" font-size="12.5" xml:space="preserve">POST /preview</text>
  <text x="530.0" y="285.0" text-anchor="middle" class="muted mono" font-size="12.5" xml:space="preserve">fetch(url)</text>
  <line class="sneg" x1="272" y1="240" x2="396" y2="240" marker-end="url(#an)"/>
  <line class="sneg" x1="396" y1="290" x2="274" y2="290" marker-end="url(#an)"/>
  <text x="155" y="372" text-anchor="middle" class="negink" font-size="12.5" font-weight="700">&quot;preview&quot; = stolen data</text>
  <line class="sneg" x1="200" y1="150" x2="294" y2="150" stroke-dasharray="6 5" marker-end="url(#an)"/>
  <text x="150" y="155" text-anchor="middle" class="negink" font-size="12.5" font-weight="700">✕ direct</text>
  <rect class="negsoft" x="780" y="120" width="350" height="90" rx="12" stroke-width="1.5" />
  <text x="955.0" y="161.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">Cloud metadata</text>
  <text x="955.0" y="181.25" text-anchor="middle" class="muted mono" font-size="12.5" xml:space="preserve">169.254.169.254 → IAM credentials</text>
  <line class="sneg" x1="662" y1="260" x2="776" y2="165" marker-end="url(#an)"/>
  <rect class="negsoft" x="780" y="250" width="350" height="90" rx="12" stroke-width="1.5" />
  <text x="955.0" y="291.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">Admin panel</text>
  <text x="955.0" y="311.25" text-anchor="middle" class="muted mono" font-size="12.5" xml:space="preserve">http://10.0.0.5/admin</text>
  <line class="sneg" x1="662" y1="260" x2="776" y2="295" marker-end="url(#an)"/>
  <rect class="negsoft" x="780" y="380" width="350" height="90" rx="12" stroke-width="1.5" />
  <text x="955.0" y="421.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">Redis</text>
  <text x="955.0" y="441.25" text-anchor="middle" class="muted mono" font-size="12.5" xml:space="preserve">localhost:6379</text>
  <line class="sneg" x1="662" y1="260" x2="776" y2="425" marker-end="url(#an)"/>
</svg>
