<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Where the rules land in your UI</title>
  <desc id="d">A sketch of a shop web page with five areas, each labelled with the rules that apply. The cookie banner: GDPR and ePrivacy require consent before non-essential cookies and trackers, with reject as easy as accept. Analytics and ad scripts: CCPA/CPRA and other US state laws require honouring Global Privacy Control; India&#x27;s DPDP rules require consent notices. The checkout payment page: PCI DSS 4.0.1 requirements 6.4.3 and 11.6.1, mandatory since March 2025, require an inventory of every script with a justification and detection of unauthorised changes to scripts and headers. The sign-up form: data minimisation, and no personal data in URLs or logs. The whole page: the European Accessibility Act, in force since June 2025, and the ADA require accessible UI, typically WCAG 2.1 or 2.2 AA.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="600" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Where the rules land in your UI</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Privacy, payment and accessibility rules turn into concrete frontend requirements.</text>
  <rect class="card" x="40" y="100" width="640" height="470" rx="16" stroke-width="1.5" />
  <rect class="sunk" x="40" y="100" width="640" height="40" rx="16" stroke-width="0" />
  <text x="64" y="126" text-anchor="start" class="muted mono" font-size="13" xml:space="preserve">shop.example</text>
  <rect class="hit" x="64" y="160" width="290" height="120" rx="12" stroke-width="1.5" />
  <text x="209.0" y="216.75" text-anchor="middle" class="ink" font-size="15" font-weight="700">Sign-up form</text>
  <text x="209.0" y="236.25" text-anchor="middle" class="muted" font-size="12.5">name · email · password</text>
  <circle cx="88" cy="184" r="13" class="acc"/>
  <text x="88" y="189" text-anchor="middle" class="onacc" font-size="13.5" font-weight="700">4</text>
  <rect class="heat" x="374" y="160" width="282" height="120" rx="12" stroke-width="1.5" />
  <text x="515.0" y="216.75" text-anchor="middle" class="ink" font-size="15" font-weight="700">Analytics &amp; ads</text>
  <text x="515.0" y="236.25" text-anchor="middle" class="muted" font-size="12.5">&lt;script src=tracker.js&gt;</text>
  <circle cx="398" cy="184" r="13" class="acc"/>
  <text x="398" y="189" text-anchor="middle" class="onacc" font-size="13.5" font-weight="700">1</text>
  <circle cx="430" cy="184" r="13" class="acc"/>
  <text x="430" y="189" text-anchor="middle" class="onacc" font-size="13.5" font-weight="700">2</text>
  <rect class="negsoft" x="64" y="300" width="592" height="120" rx="12" stroke-width="1.5" />
  <text x="360.0" y="356.75" text-anchor="middle" class="ink" font-size="15" font-weight="700">Checkout: payment fields</text>
  <text x="360.0" y="376.25" text-anchor="middle" class="muted" font-size="12.5">hosted iframe from the payment provider</text>
  <circle cx="88" cy="324" r="13" class="acc"/>
  <text x="88" y="329" text-anchor="middle" class="onacc" font-size="13.5" font-weight="700">3</text>
  <rect class="heat" x="64" y="440" width="592" height="110" rx="12" stroke-width="1.5" />
  <text x="360.0" y="491.75" text-anchor="middle" class="ink" font-size="15" font-weight="700">Cookie banner</text>
  <text x="360.0" y="511.25" text-anchor="middle" class="muted" font-size="12.5">Accept all  ·  Reject all  ·  Settings</text>
  <circle cx="88" cy="464" r="13" class="acc"/>
  <text x="88" y="469" text-anchor="middle" class="onacc" font-size="13.5" font-weight="700">1</text>
  <circle cx="656" cy="120" r="13" class="acc"/>
  <text x="656" y="125" text-anchor="middle" class="onacc" font-size="13.5" font-weight="700">5</text>
  <text x="636" y="126" text-anchor="end" class="muted" font-size="12">whole page</text>
  <rect class="card" x="720" y="140" width="440" height="66" rx="10" stroke-width="1.5" />
  <circle cx="746" cy="172" r="13" class="acc"/>
  <text x="746" y="177" text-anchor="middle" class="onacc" font-size="13.5" font-weight="700">1</text>
  <text x="772" y="166" text-anchor="start" class="heatink" font-size="14.5" font-weight="700">GDPR · ePrivacy</text>
  <text x="772" y="188" text-anchor="start" class="muted" font-size="12.5">consent before trackers; reject as easy as accept</text>
  <rect class="card" x="720" y="220" width="440" height="66" rx="10" stroke-width="1.5" />
  <circle cx="746" cy="252" r="13" class="acc"/>
  <text x="746" y="257" text-anchor="middle" class="onacc" font-size="13.5" font-weight="700">2</text>
  <text x="772" y="246" text-anchor="start" class="heatink" font-size="14.5" font-weight="700">CCPA/CPRA · US states · DPDP (India)</text>
  <text x="772" y="268" text-anchor="start" class="muted" font-size="12.5">honour Global Privacy Control; clear notices</text>
  <rect class="card" x="720" y="300" width="440" height="66" rx="10" stroke-width="1.5" />
  <circle cx="746" cy="332" r="13" class="acc"/>
  <text x="746" y="337" text-anchor="middle" class="onacc" font-size="13.5" font-weight="700">3</text>
  <text x="772" y="326" text-anchor="start" class="negink" font-size="14.5" font-weight="700">PCI DSS 4.0.1: 6.4.3 &amp; 11.6.1</text>
  <text x="772" y="348" text-anchor="start" class="muted" font-size="12.5">inventory every script; detect tampering (since 3/2025)</text>
  <rect class="card" x="720" y="380" width="440" height="66" rx="10" stroke-width="1.5" />
  <circle cx="746" cy="412" r="13" class="acc"/>
  <text x="746" y="417" text-anchor="middle" class="onacc" font-size="13.5" font-weight="700">4</text>
  <text x="772" y="406" text-anchor="start" class="accink" font-size="14.5" font-weight="700">GDPR data minimisation</text>
  <text x="772" y="428" text-anchor="start" class="muted" font-size="12.5">collect less; no PII in URLs, logs, analytics</text>
  <rect class="card" x="720" y="460" width="440" height="66" rx="10" stroke-width="1.5" />
  <circle cx="746" cy="492" r="13" class="acc"/>
  <text x="746" y="497" text-anchor="middle" class="onacc" font-size="13.5" font-weight="700">5</text>
  <text x="772" y="486" text-anchor="start" class="posink" font-size="14.5" font-weight="700">EAA (since 6/2025) · ADA</text>
  <text x="772" y="508" text-anchor="start" class="muted" font-size="12.5">accessible UI: WCAG 2.1 / 2.2 AA</text>
</svg>
