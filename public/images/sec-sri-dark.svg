<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Subresource Integrity: check before you run</title>
  <desc id="d">Your HTML pins a script from a CDN with integrity sha384-oqVu… . Top row: the CDN serves the genuine file; the browser computes its SHA-384 hash, it matches the pinned value, and the script runs. Bottom row: the CDN has been compromised and serves a modified file; the computed hash is different, so the browser refuses to run it and reports a network error. A newer Integrity-Policy header can require SRI on every script.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="500" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Subresource Integrity: check before you run</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">The browser hashes what it downloaded and compares it with the hash you pinned in the HTML.</text>
  <rect class="hit" x="40" y="100" width="1120" height="64" rx="12" stroke-width="1.5" />
  <text x="60" y="140" text-anchor="start" class="ink mono" font-size="13" xml:space="preserve">&lt;script src=&quot;https://cdn.example/lib@4.17.21.min.js&quot; integrity=&quot;sha384-oqVu…&quot; crossorigin=&quot;anonymous&quot;&gt;</text>
  <rect class="card" x="40" y="200" width="240" height="100" rx="12" stroke-width="1.5" />
  <text x="160.0" y="246.75" text-anchor="middle" class="ink" font-size="15" font-weight="700">CDN serves</text>
  <text x="160.0" y="266.25" text-anchor="middle" class="muted" font-size="12.5">genuine file</text>
  <line class="line" x1="282" y1="250" x2="346" y2="250" marker-end="url(#a)"/>
  <rect class="sunk" x="350" y="200" width="260" height="100" rx="12" stroke-width="1.5" />
  <text x="480.0" y="246.5" text-anchor="middle" class="ink" font-size="15" font-weight="700">Browser hashes it</text>
  <text x="480.0" y="266.5" text-anchor="middle" class="muted mono" font-size="13" xml:space="preserve">sha384-oqVu…</text>
  <line class="line" x1="612" y1="250" x2="676" y2="250" marker-end="url(#a)"/>
  <rect class="card" x="680" y="200" width="200" height="100" rx="12" stroke-width="1.5" />
  <text x="780.0" y="237.5" text-anchor="middle" class="ink" font-size="15" font-weight="700">Compare</text>
  <text x="780.0" y="257.5" text-anchor="middle" class="muted" font-size="13">with the integrity attribute</text>
  <text x="780.0" y="275.5" text-anchor="middle" class="muted" font-size="13">match</text>
  <line class="spos" x1="882" y1="250" x2="946" y2="250" marker-end="url(#ap)"/>
  <rect class="possoft" x="950" y="200" width="210" height="100" rx="12" stroke-width="1.5" />
  <text x="1055.0" y="246.75" text-anchor="middle" class="posink" font-size="15" font-weight="700">✓ Runs</text>
  <text x="1055.0" y="266.25" text-anchor="middle" class="muted" font-size="12.5">as normal</text>
  <rect class="negsoft" x="40" y="340" width="240" height="100" rx="12" stroke-width="1.5" />
  <text x="160.0" y="386.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">CDN serves</text>
  <text x="160.0" y="406.25" text-anchor="middle" class="muted" font-size="12.5">tampered file</text>
  <line class="line" x1="282" y1="390" x2="346" y2="390" marker-end="url(#a)"/>
  <rect class="sunk" x="350" y="340" width="260" height="100" rx="12" stroke-width="1.5" />
  <text x="480.0" y="386.5" text-anchor="middle" class="ink" font-size="15" font-weight="700">Browser hashes it</text>
  <text x="480.0" y="406.5" text-anchor="middle" class="muted mono" font-size="13" xml:space="preserve">sha384-Zx81…</text>
  <line class="line" x1="612" y1="390" x2="676" y2="390" marker-end="url(#a)"/>
  <rect class="card" x="680" y="340" width="200" height="100" rx="12" stroke-width="1.5" />
  <text x="780.0" y="377.5" text-anchor="middle" class="ink" font-size="15" font-weight="700">Compare</text>
  <text x="780.0" y="397.5" text-anchor="middle" class="muted" font-size="13">with the integrity attribute</text>
  <text x="780.0" y="415.5" text-anchor="middle" class="muted" font-size="13">mismatch</text>
  <line class="sneg" x1="882" y1="390" x2="946" y2="390" marker-end="url(#an)"/>
  <rect class="negsoft" x="950" y="340" width="210" height="100" rx="12" stroke-width="1.5" />
  <text x="1055.0" y="386.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">✕ Blocked</text>
  <text x="1055.0" y="406.25" text-anchor="middle" class="muted" font-size="12.5">network error, reported</text>
  <text x="600" y="482" text-anchor="middle" class="muted mono" font-size="13" xml:space="preserve">Integrity-Policy: blocked-destinations=(script)  — newer header that requires SRI on every script</text>
</svg>
