<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">The lethal trifecta</title>
  <desc id="d">Three overlapping circles. Access to private data, such as email, files or a customer database. Exposure to untrusted content, such as web pages, emails, documents or issues written by others. The ability to communicate externally, such as sending email, making HTTP requests, or rendering images and links. Where all three overlap, a prompt injection in the untrusted content can make the agent read private data and send it out. The term was coined by Simon Willison. The defence is to design so no single agent session has all three, or to put a human approval step on external actions.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">The lethal trifecta</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">An AI agent with all three capabilities can be tricked into stealing data. Remove any one leg.</text>
  <circle cx="400" cy="250" r="150" class="acc" opacity=".25"/>
  <circle cx="600" cy="250" r="150" class="heatfill" opacity=".25"/>
  <circle cx="500" cy="400" r="150" class="neg" opacity=".25"/>
  <text x="330" y="210" text-anchor="middle" class="ink" font-size="16" font-weight="700">Private data</text>
  <text x="330" y="232" text-anchor="middle" class="muted" font-size="12.5">email, files, customer DB</text>
  <text x="670" y="210" text-anchor="middle" class="ink" font-size="16" font-weight="700">Untrusted content</text>
  <text x="670" y="232" text-anchor="middle" class="muted" font-size="12.5">web pages, emails, issues</text>
  <text x="500" y="490" text-anchor="middle" class="ink" font-size="16" font-weight="700">External communication</text>
  <text x="500" y="512" text-anchor="middle" class="muted" font-size="12.5">send, fetch, render links</text>
  <text x="500" y="312" text-anchor="middle" class="negink" font-size="17" font-weight="700">data theft</text>
  <text x="500" y="334" text-anchor="middle" class="negink" font-size="17" font-weight="700">possible</text>
  <rect class="possoft" x="840" y="140" width="320" height="300" rx="14" stroke-width="1.5" />
  <text x="860" y="172" text-anchor="start" class="posink head" font-size="12.5">REMOVE ANY ONE LEG</text>
  <text x="862" y="212" text-anchor="middle" class="posink" font-size="13.5" font-weight="700">✓</text>
  <text x="880" y="212" text-anchor="start" class="ink" font-size="13.5">keep private data out, or</text>
  <text x="862" y="246" text-anchor="middle" class="posink" font-size="13.5" font-weight="700">✓</text>
  <text x="880" y="246" text-anchor="start" class="ink" font-size="13.5">keep untrusted input out, or</text>
  <text x="862" y="280" text-anchor="middle" class="posink" font-size="13.5" font-weight="700">✓</text>
  <text x="880" y="280" text-anchor="start" class="ink" font-size="13.5">remove the outbound channel, or</text>
  <text x="862" y="314" text-anchor="middle" class="posink" font-size="13.5" font-weight="700">✓</text>
  <text x="880" y="314" text-anchor="start" class="ink" font-size="13.5">a human approves every send</text>
  <text x="860" y="370" text-anchor="start" class="muted" font-size="12.5">Filters and &quot;please ignore injected</text>
  <text x="860" y="390" text-anchor="start" class="muted" font-size="12.5">instructions&quot; prompts reduce risk</text>
  <text x="860" y="410" text-anchor="start" class="muted" font-size="12.5">but are not a guarantee.</text>
  <text x="40" y="540" text-anchor="start" class="muted" font-size="12">Term coined by Simon Willison (2025).</text>
</svg>
