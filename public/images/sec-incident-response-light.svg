<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">A compromised package is published: the first hour</title>
  <desc id="d">A timeline of responding to a malicious release such as axios 1.14.1 in March 2026. Minute 0: an advisory or a tool alert names the bad versions. Minutes 5 to 15: query SBOMs and lockfiles across all repos and images to find which ones resolved the bad version during the exposure window. Minutes 15 to 30: block the versions in the registry proxy, pin the last good version, and purge caches. Minutes 30 to 60: on any machine or CI runner that installed it, assume compromise: rotate npm, GitHub, cloud and API tokens, rebuild runners, and review what was published or deployed. Afterwards: write up what happened and tighten policy, for example a minimum release age.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="420" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">A compromised package is published: the first hour</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">With an SBOM and a lockfile you can answer &quot;are we affected?&quot; in minutes, not days.</text>
  <rect class="accsoft" x="109.625" y="111.5" width="60.75" height="24.5" rx="12.25" stroke-width="1.2" />
  <text x="140.0" y="129" text-anchor="middle" class="accink mono" font-size="12.5" font-weight="700" xml:space="preserve">0 min</text>
  <rect class="heat" x="40" y="150" width="200" height="150" rx="12" stroke-width="1.5" />
  <text x="140.0" y="213.0" text-anchor="middle" class="heatink" font-size="15" font-weight="700">Alert</text>
  <text x="140.0" y="232.5" text-anchor="middle" class="muted" font-size="12.5">advisory or tool</text>
  <text x="140.0" y="250.0" text-anchor="middle" class="muted" font-size="12.5">names bad versions</text>
  <line class="line" x1="242" y1="225" x2="264" y2="225" marker-end="url(#a)"/>
  <rect class="accsoft" x="341.5" y="111.5" width="53.0" height="24.5" rx="12.25" stroke-width="1.2" />
  <text x="368.0" y="129" text-anchor="middle" class="accink mono" font-size="12.5" font-weight="700" xml:space="preserve">5–15</text>
  <rect class="hit" x="268" y="150" width="200" height="150" rx="12" stroke-width="1.5" />
  <text x="368.0" y="213.0" text-anchor="middle" class="accink" font-size="15" font-weight="700">Am I affected?</text>
  <text x="368.0" y="232.5" text-anchor="middle" class="muted" font-size="12.5">query SBOMs +</text>
  <text x="368.0" y="250.0" text-anchor="middle" class="muted" font-size="12.5">lockfiles everywhere</text>
  <line class="line" x1="470" y1="225" x2="492" y2="225" marker-end="url(#a)"/>
  <rect class="accsoft" x="565.625" y="111.5" width="60.75" height="24.5" rx="12.25" stroke-width="1.2" />
  <text x="596.0" y="129" text-anchor="middle" class="accink mono" font-size="12.5" font-weight="700" xml:space="preserve">15–30</text>
  <rect class="card" x="496" y="150" width="200" height="150" rx="12" stroke-width="1.5" />
  <text x="596.0" y="213.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Contain</text>
  <text x="596.0" y="232.5" text-anchor="middle" class="muted" font-size="12.5">block in proxy, pin</text>
  <text x="596.0" y="250.0" text-anchor="middle" class="muted" font-size="12.5">good version, purge cache</text>
  <line class="line" x1="698" y1="225" x2="720" y2="225" marker-end="url(#a)"/>
  <rect class="accsoft" x="793.625" y="111.5" width="60.75" height="24.5" rx="12.25" stroke-width="1.2" />
  <text x="824.0" y="129" text-anchor="middle" class="accink mono" font-size="12.5" font-weight="700" xml:space="preserve">30–60</text>
  <rect class="negsoft" x="724" y="150" width="200" height="150" rx="12" stroke-width="1.5" />
  <text x="824.0" y="213.0" text-anchor="middle" class="negink" font-size="15" font-weight="700">Assume breach</text>
  <text x="824.0" y="232.5" text-anchor="middle" class="muted" font-size="12.5">rotate tokens, rebuild</text>
  <text x="824.0" y="250.0" text-anchor="middle" class="muted" font-size="12.5">runners, review deploys</text>
  <line class="line" x1="926" y1="225" x2="948" y2="225" marker-end="url(#a)"/>
  <rect class="accsoft" x="1021.625" y="111.5" width="60.75" height="24.5" rx="12.25" stroke-width="1.2" />
  <text x="1052.0" y="129" text-anchor="middle" class="accink mono" font-size="12.5" font-weight="700" xml:space="preserve">after</text>
  <rect class="possoft" x="952" y="150" width="200" height="150" rx="12" stroke-width="1.5" />
  <text x="1052.0" y="213.0" text-anchor="middle" class="posink" font-size="15" font-weight="700">Learn</text>
  <text x="1052.0" y="232.5" text-anchor="middle" class="muted" font-size="12.5">postmortem, tighten</text>
  <text x="1052.0" y="250.0" text-anchor="middle" class="muted" font-size="12.5">release-age policy</text>
  <text x="600" y="350" text-anchor="middle" class="ink" font-size="14" font-weight="700">An install script runs with the permissions of whoever ran npm install: that is why rotating credentials is not optional.</text>
  <text x="600" y="380" text-anchor="middle" class="muted" font-size="13">Example: axios 1.14.1 / 0.30.4 (31 March 2026) pulled in plain-crypto-js, whose install script dropped a remote-access trojan.</text>
</svg>
