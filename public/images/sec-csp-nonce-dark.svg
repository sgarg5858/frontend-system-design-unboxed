<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">A strict CSP with nonces</title>
  <desc id="d">The server generates a random nonce, here r4nd0m, for each response. It sends the header Content-Security-Policy script-src nonce-r4nd0m strict-dynamic and puts nonce=&quot;r4nd0m&quot; on its own script tags. In the HTML, the app&#x27;s own script tag has the nonce and runs; a script it loads is allowed through strict-dynamic. An injected script tag from a comment has no nonce and is blocked, and an inline onerror handler is blocked too. Because the nonce changes on every response, an attacker cannot guess it.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="520" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">A strict CSP with nonces</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">A fresh random nonce on every response. Only scripts carrying it run, and injected markup never knows it.</text>
  <rect class="sunk" x="40" y="110" width="260" height="130" rx="12" stroke-width="1.5" />
  <text x="170.0" y="162.5" text-anchor="middle" class="ink" font-size="15" font-weight="700">Server, per response</text>
  <text x="170.0" y="182.5" text-anchor="middle" class="muted mono" font-size="13" xml:space="preserve">nonce = random(128 bits)</text>
  <text x="170.0" y="200.5" text-anchor="middle" class="muted mono" font-size="13" xml:space="preserve">→ r4nd0m</text>
  <line class="sacc" x1="302" y1="150" x2="400" y2="150" marker-end="url(#aa)"/>
  <line class="sacc" x1="302" y1="205" x2="400" y2="280" marker-end="url(#aa)"/>
  <rect class="hit" x="404" y="104" width="756" height="82" rx="12" stroke-width="1.5" />
  <text x="424" y="136" text-anchor="start" class="accink mono" font-size="14" font-weight="700" xml:space="preserve">Content-Security-Policy:</text>
  <text x="424" y="162" text-anchor="start" class="ink mono" font-size="13" xml:space="preserve">script-src &#x27;nonce-r4nd0m&#x27; &#x27;strict-dynamic&#x27;; object-src &#x27;none&#x27;; base-uri &#x27;none&#x27;</text>
  <rect class="card" x="404" y="210" width="756" height="270" rx="12" stroke-width="1.5" />
  <text x="424" y="240" text-anchor="start" class="muted" font-size="12.5" font-weight="700">HTML</text>
  <rect class="possoft" x="420" y="250" width="724" height="34" rx="8" stroke-width="1" />
  <text x="442" y="274" text-anchor="middle" class="posink" font-size="16" font-weight="700">✓</text>
  <text x="462" y="274" text-anchor="start" class="ink mono" font-size="13" xml:space="preserve">&lt;script nonce=&quot;r4nd0m&quot; src=&quot;/app.js&quot;&gt;</text>
  <text x="1130" y="274" text-anchor="end" class="posink" font-size="12.5" font-weight="700">has the nonce: runs</text>
  <rect class="possoft" x="420" y="292" width="724" height="34" rx="8" stroke-width="1" />
  <text x="442" y="316" text-anchor="middle" class="posink" font-size="16" font-weight="700">✓</text>
  <text x="462" y="316" text-anchor="start" class="ink mono" font-size="13" xml:space="preserve">  └ app.js loads chart.js</text>
  <text x="1130" y="316" text-anchor="end" class="posink" font-size="12.5" font-weight="700">trusted by &#x27;strict-dynamic&#x27;</text>
  <rect class="negsoft" x="420" y="334" width="724" height="34" rx="8" stroke-width="1" />
  <text x="442" y="358" text-anchor="middle" class="negink" font-size="16" font-weight="700">✕</text>
  <text x="462" y="358" text-anchor="start" class="ink mono" font-size="13" xml:space="preserve">&lt;script&gt;steal()&lt;/script&gt;</text>
  <text x="1130" y="358" text-anchor="end" class="negink" font-size="12.5" font-weight="700">injected, no nonce: blocked</text>
  <rect class="negsoft" x="420" y="376" width="724" height="34" rx="8" stroke-width="1" />
  <text x="442" y="400" text-anchor="middle" class="negink" font-size="16" font-weight="700">✕</text>
  <text x="462" y="400" text-anchor="start" class="ink mono" font-size="13" xml:space="preserve">&lt;img src=x onerror=&quot;steal()&quot;&gt;</text>
  <text x="1130" y="400" text-anchor="end" class="negink" font-size="12.5" font-weight="700">inline handler: blocked</text>
  <rect class="negsoft" x="420" y="418" width="724" height="34" rx="8" stroke-width="1" />
  <text x="442" y="442" text-anchor="middle" class="negink" font-size="16" font-weight="700">✕</text>
  <text x="462" y="442" text-anchor="start" class="ink mono" font-size="13" xml:space="preserve">&lt;script src=&quot;https://evil.example/x.js&quot;&gt;</text>
  <text x="1130" y="442" text-anchor="end" class="negink" font-size="12.5" font-weight="700">no nonce: blocked</text>
</svg>
