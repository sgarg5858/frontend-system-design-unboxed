<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">CORS: the preflight conversation</title>
  <desc id="d">A sequence diagram with three lifelines: your JavaScript on app.example, the browser, and api.example. 1: your code calls fetch with method PUT and a JSON body. 2: the browser sends an OPTIONS preflight with Origin https://app.example and Access-Control-Request-Method PUT. 3: the API replies 204 with Access-Control-Allow-Origin https://app.example, Allow-Methods PUT and Max-Age 600. 4: the browser sends the real PUT. 5: the API replies 200 with Access-Control-Allow-Origin again. 6: the browser hands the response to your code. If step 3 or 5 lacks the right headers, the browser blocks your code from reading the response.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="580" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">CORS: the preflight conversation</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">For a non-simple request, the browser asks first. Your JavaScript only sees the final response if the server says yes.</text>
  <rect class="card" x="80" y="100" width="240" height="64" rx="12" stroke-width="1.5" />
  <text x="200.0" y="129.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Your JS</text>
  <text x="200.0" y="148.0" text-anchor="middle" class="muted" font-size="12">app.example</text>
  <line class="thin" x1="200" y1="166" x2="200" y2="560" stroke-dasharray="4 5"/>
  <rect class="hit" x="480" y="100" width="240" height="64" rx="12" stroke-width="1.5" />
  <text x="600.0" y="129.0" text-anchor="middle" class="accink" font-size="15" font-weight="700">Browser</text>
  <text x="600.0" y="148.0" text-anchor="middle" class="muted" font-size="12">enforces CORS</text>
  <line class="thin" x1="600" y1="166" x2="600" y2="560" stroke-dasharray="4 5"/>
  <rect class="card" x="880" y="100" width="240" height="64" rx="12" stroke-width="1.5" />
  <text x="1000.0" y="129.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">api.example</text>
  <text x="1000.0" y="148.0" text-anchor="middle" class="muted" font-size="12">decides</text>
  <line class="thin" x1="1000" y1="166" x2="1000" y2="560" stroke-dasharray="4 5"/>
  <line class="line" x1="200" y1="200" x2="594" y2="200" marker-end="url(#a)"/>
  <text x="400.0" y="190" text-anchor="middle" class="ink" font-size="12.5">1 · fetch(url, { method: &#x27;PUT&#x27;, body })</text>
  <line class="line" x1="600" y1="260" x2="994" y2="260" marker-end="url(#a)"/>
  <text x="800.0" y="250" text-anchor="middle" class="muted mono" font-size="12.5" xml:space="preserve">2 · OPTIONS  Origin: https://app.example · Request-Method: PUT</text>
  <line class="spos" x1="1000" y1="320" x2="606" y2="320" marker-end="url(#ap)"/>
  <text x="800.0" y="310" text-anchor="middle" class="posink mono" font-size="12.5" font-weight="700" xml:space="preserve">3 · 204  Allow-Origin: https://app.example · Methods: PUT · Max-Age: 600</text>
  <line class="sacc" x1="600" y1="390" x2="994" y2="390" marker-end="url(#aa)"/>
  <text x="800.0" y="380" text-anchor="middle" class="accink mono" font-size="12.5" xml:space="preserve">4 · PUT  Origin: https://app.example · Content-Type: application/json</text>
  <line class="spos" x1="1000" y1="450" x2="606" y2="450" marker-end="url(#ap)"/>
  <text x="800.0" y="440" text-anchor="middle" class="posink mono" font-size="12.5" font-weight="700" xml:space="preserve">5 · 200  Access-Control-Allow-Origin: https://app.example</text>
  <line class="spos" x1="600" y1="510" x2="206" y2="510" marker-end="url(#ap)"/>
  <text x="400.0" y="500" text-anchor="middle" class="posink" font-size="12.5" font-weight="700">6 · response is readable</text>
  <text x="400" y="352" text-anchor="middle" class="muted" font-size="11.5" font-style="italic">preflight answer cached for 600 s</text>
</svg>
