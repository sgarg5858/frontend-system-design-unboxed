<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">How a dependency scanner (SCA) works</title>
  <desc id="d">Five steps from left to right. 1, Inventory: read package-lock.json or an SBOM to list every package and exact version, direct and transitive. 2, Match: compare each package and version against vulnerability databases such as the GitHub Advisory Database, OSV and NVD, and against malware feeds. 3, Context: ask whether the vulnerable code ships to users or is only a dev tool, whether the vulnerable function is reachable, and whether the workload is exposed to the internet. 4, Prioritise: rank by known exploitation (CISA KEV), exploit likelihood (EPSS) and severity (CVSS). 5, Fix: open an upgrade pull request, or block the build or download by policy.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="470" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">How a dependency scanner (SCA) works</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Software composition analysis turns your lockfile into a prioritised list of fixes.</text>
  <rect class="card" x="40" y="120" width="200" height="200" rx="12" stroke-width="1.5" />
  <text x="140.0" y="198.5" text-anchor="middle" class="ink" font-size="15" font-weight="700">1 · Inventory</text>
  <text x="140.0" y="218.5" text-anchor="middle" class="muted" font-size="13">package-lock.json</text>
  <text x="140.0" y="236.5" text-anchor="middle" class="muted" font-size="13">or an SBOM</text>
  <text x="140.0" y="254.5" text-anchor="middle" class="muted" font-size="13">1,200 packages</text>
  <line class="line" x1="242" y1="220" x2="264" y2="220" marker-end="url(#a)"/>
  <rect class="card" x="268" y="120" width="200" height="200" rx="12" stroke-width="1.5" />
  <text x="368.0" y="198.5" text-anchor="middle" class="ink" font-size="15" font-weight="700">2 · Match</text>
  <text x="368.0" y="218.5" text-anchor="middle" class="muted" font-size="13">GitHub Advisory DB</text>
  <text x="368.0" y="236.5" text-anchor="middle" class="muted" font-size="13">OSV · NVD</text>
  <text x="368.0" y="254.5" text-anchor="middle" class="muted" font-size="13">malware feeds</text>
  <line class="line" x1="470" y1="220" x2="492" y2="220" marker-end="url(#a)"/>
  <rect class="hit" x="496" y="120" width="200" height="200" rx="12" stroke-width="1.5" />
  <text x="596.0" y="198.5" text-anchor="middle" class="accink" font-size="15" font-weight="700">3 · Context</text>
  <text x="596.0" y="218.5" text-anchor="middle" class="muted" font-size="13">ships to users?</text>
  <text x="596.0" y="236.5" text-anchor="middle" class="muted" font-size="13">reachable?</text>
  <text x="596.0" y="254.5" text-anchor="middle" class="muted" font-size="13">internet-exposed?</text>
  <line class="line" x1="698" y1="220" x2="720" y2="220" marker-end="url(#a)"/>
  <rect class="heat" x="724" y="120" width="200" height="200" rx="12" stroke-width="1.5" />
  <text x="824.0" y="198.5" text-anchor="middle" class="heatink" font-size="15" font-weight="700">4 · Prioritise</text>
  <text x="824.0" y="218.5" text-anchor="middle" class="muted" font-size="13">KEV: exploited now</text>
  <text x="824.0" y="236.5" text-anchor="middle" class="muted" font-size="13">EPSS: likely soon</text>
  <text x="824.0" y="254.5" text-anchor="middle" class="muted" font-size="13">CVSS: how bad</text>
  <line class="line" x1="926" y1="220" x2="948" y2="220" marker-end="url(#a)"/>
  <rect class="possoft" x="952" y="120" width="200" height="200" rx="12" stroke-width="1.5" />
  <text x="1052.0" y="198.5" text-anchor="middle" class="posink" font-size="15" font-weight="700">5 · Fix</text>
  <text x="1052.0" y="218.5" text-anchor="middle" class="muted" font-size="13">upgrade PR</text>
  <text x="1052.0" y="236.5" text-anchor="middle" class="muted" font-size="13">or block by policy</text>
  <text x="1052.0" y="254.5" text-anchor="middle" class="muted" font-size="13">track SLA</text>
  <rect class="sunk" x="40" y="350" width="1120" height="80" rx="12" stroke-width="0" />
  <text x="60" y="382" text-anchor="start" class="ink" font-size="14" font-weight="700">Where it runs:</text>
  <text x="60" y="408" text-anchor="start" class="muted" font-size="14">IDE  ·  pull request  ·  CI build  ·  registry / proxy  ·  container image  ·  running cloud workload</text>
</svg>
