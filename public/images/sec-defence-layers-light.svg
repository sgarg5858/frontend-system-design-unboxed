<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Defence in depth</title>
  <desc id="d">Four attacks travel from left to right through four layers of defence. Layer 1 is encoding and sanitizing output; layer 2 is a Content Security Policy with Trusted Types; layer 3 is cookie settings (HttpOnly, SameSite) and CSRF checks; layer 4 is the server enforcing authentication and authorisation. An XSS payload in a comment is stopped at layer 1, and if it slips through, at layer 2. A malicious third-party script is not stopped by encoding but is limited by CSP and can&#x27;t read HttpOnly cookies. A forged cross-site request is stopped by SameSite cookies and CSRF checks. A tampered API call made with curl bypasses the browser entirely and is only stopped by the server.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Defence in depth</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Each attack has to get past several independent layers. One mistake should not be enough.</text>
  <rect class="accsoft" x="300" y="100" width="170" height="430" rx="12" stroke-width="1.5" />
  <text x="385" y="128" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">1 · Encode &amp; sanitize</text>
  <text x="385" y="148" text-anchor="middle" class="muted" font-size="11.5">textContent, DOMPurify</text>
  <rect class="accsoft" x="520" y="100" width="170" height="430" rx="12" stroke-width="1.5" />
  <text x="605" y="128" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">2 · CSP + Trusted Types</text>
  <text x="605" y="148" text-anchor="middle" class="muted" font-size="11.5">nonces, no inline JS</text>
  <rect class="accsoft" x="740" y="100" width="170" height="430" rx="12" stroke-width="1.5" />
  <text x="825" y="128" text-anchor="middle" class="accink" font-size="13.5" font-weight="700">3 · Cookies &amp; CSRF</text>
  <text x="825" y="148" text-anchor="middle" class="muted" font-size="11.5">HttpOnly, SameSite, tokens</text>
  <rect class="possoft" x="960" y="100" width="170" height="430" rx="12" stroke-width="1.5" />
  <text x="1045" y="128" text-anchor="middle" class="posink" font-size="13.5" font-weight="700">4 · Server checks</text>
  <text x="1045" y="148" text-anchor="middle" class="muted" font-size="11.5">authn, authz, validation</text>
  <rect class="negsoft" x="40" y="188" width="236" height="50" rx="10" stroke-width="1.5" />
  <text x="158" y="218" text-anchor="middle" class="ink" font-size="13.5" font-weight="700">XSS payload in a comment</text>
  <line class="sneg" x1="278" y1="214" x2="367" y2="214" marker-end="url(#an)"/>
  <text x="385" y="221" text-anchor="middle" class="negink" font-size="22" font-weight="700">✕</text>
  <text x="403" y="244" text-anchor="middle" class="muted" font-size="11.5">stopped at 1; 2 is the backup</text>
  <rect class="negsoft" x="40" y="270" width="236" height="50" rx="10" stroke-width="1.5" />
  <text x="158" y="300" text-anchor="middle" class="ink" font-size="13.5" font-weight="700">Compromised third-party script</text>
  <line class="sneg" x1="278" y1="296" x2="587" y2="296" marker-end="url(#an)"/>
  <text x="605" y="303" text-anchor="middle" class="negink" font-size="22" font-weight="700">✕</text>
  <text x="623" y="326" text-anchor="middle" class="muted" font-size="11.5">limited by CSP; can&#x27;t read HttpOnly</text>
  <rect class="negsoft" x="40" y="352" width="236" height="50" rx="10" stroke-width="1.5" />
  <text x="158" y="382" text-anchor="middle" class="ink" font-size="13.5" font-weight="700">Forged cross-site request</text>
  <line class="sneg" x1="278" y1="378" x2="807" y2="378" marker-end="url(#an)"/>
  <text x="825" y="385" text-anchor="middle" class="negink" font-size="22" font-weight="700">✕</text>
  <text x="843" y="408" text-anchor="middle" class="muted" font-size="11.5">no cookie, no valid token</text>
  <rect class="negsoft" x="40" y="434" width="236" height="50" rx="10" stroke-width="1.5" />
  <text x="158" y="464" text-anchor="middle" class="ink" font-size="13.5" font-weight="700">Tampered call with curl</text>
  <line class="sneg" x1="278" y1="460" x2="1027" y2="460" marker-end="url(#an)"/>
  <text x="1045" y="467" text-anchor="middle" class="negink" font-size="22" font-weight="700">✕</text>
  <text x="1063" y="490" text-anchor="middle" class="muted" font-size="11.5">only the server can say no</text>
</svg>
