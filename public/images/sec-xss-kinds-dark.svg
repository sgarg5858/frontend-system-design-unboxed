<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Three ways a payload reaches the page</title>
  <desc id="d">Three lanes. Stored XSS: an attacker posts a comment containing a script, the database stores it, the app renders it as HTML, and it runs for every viewer. Reflected XSS: the attacker sends a crafted link with the payload in the query string, the server echoes it into the HTML response, and it runs for whoever clicks the link. DOM-based XSS: the payload is in the URL fragment after the hash, which never reaches the server; client JavaScript reads location.hash and writes it into innerHTML, and it runs in the victim&#x27;s tab. Each lane ends in a red box: the script runs with your origin&#x27;s privileges.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="520" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Three ways a payload reaches the page</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Stored, reflected and DOM-based XSS differ in where the payload travels. All end in the same place: a sink that runs it.</text>
  <text x="40" y="164" text-anchor="start" class="ink" font-size="18" font-weight="700">Stored</text>
  <rect class="card" x="170" y="112" width="216" height="92" rx="12" stroke-width="1.5" />
  <text x="278.0" y="155.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Attacker posts</text>
  <text x="278.0" y="174.0" text-anchor="middle" class="muted" font-size="12">a comment with &lt;img onerror&gt;</text>
  <line class="line" x1="388" y1="158" x2="416" y2="158" marker-end="url(#a)"/>
  <rect class="card" x="420" y="112" width="216" height="92" rx="12" stroke-width="1.5" />
  <text x="528.0" y="155.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Database</text>
  <text x="528.0" y="174.0" text-anchor="middle" class="muted" font-size="12">stores it as text</text>
  <line class="line" x1="638" y1="158" x2="666" y2="158" marker-end="url(#a)"/>
  <rect class="card" x="670" y="112" width="216" height="92" rx="12" stroke-width="1.5" />
  <text x="778.0" y="155.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">App renders it</text>
  <text x="778.0" y="174.0" text-anchor="middle" class="muted" font-size="12">as HTML for every page view</text>
  <line class="line" x1="888" y1="158" x2="916" y2="158" marker-end="url(#a)"/>
  <rect class="negsoft" x="920" y="112" width="216" height="92" rx="12" stroke-width="1.5" />
  <text x="1028.0" y="155.0" text-anchor="middle" class="negink" font-size="15" font-weight="700">Runs for every viewer</text>
  <text x="1028.0" y="174.0" text-anchor="middle" class="muted" font-size="12">of that page</text>
  <text x="40" y="296" text-anchor="start" class="ink" font-size="18" font-weight="700">Reflected</text>
  <rect class="card" x="170" y="244" width="216" height="92" rx="12" stroke-width="1.5" />
  <text x="278.0" y="287.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Crafted link</text>
  <text x="278.0" y="306.0" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">/search?q=&lt;script&gt;…</text>
  <line class="line" x1="388" y1="290" x2="416" y2="290" marker-end="url(#a)"/>
  <rect class="card" x="420" y="244" width="216" height="92" rx="12" stroke-width="1.5" />
  <text x="528.0" y="287.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Server</text>
  <text x="528.0" y="306.0" text-anchor="middle" class="muted" font-size="12">echoes q into the HTML</text>
  <line class="line" x1="638" y1="290" x2="666" y2="290" marker-end="url(#a)"/>
  <rect class="card" x="670" y="244" width="216" height="92" rx="12" stroke-width="1.5" />
  <text x="778.0" y="287.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Victim&#x27;s browser</text>
  <text x="778.0" y="306.0" text-anchor="middle" class="muted" font-size="12">parses the response</text>
  <line class="line" x1="888" y1="290" x2="916" y2="290" marker-end="url(#a)"/>
  <rect class="negsoft" x="920" y="244" width="216" height="92" rx="12" stroke-width="1.5" />
  <text x="1028.0" y="287.0" text-anchor="middle" class="negink" font-size="15" font-weight="700">Runs for whoever</text>
  <text x="1028.0" y="306.0" text-anchor="middle" class="muted" font-size="12">clicks the link</text>
  <text x="40" y="428" text-anchor="start" class="ink" font-size="18" font-weight="700">DOM-based</text>
  <rect class="card" x="170" y="376" width="216" height="92" rx="12" stroke-width="1.5" />
  <text x="278.0" y="419.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Crafted link</text>
  <text x="278.0" y="438.0" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">/#&lt;img src=x onerror=…&gt;</text>
  <line class="line" x1="388" y1="422" x2="416" y2="422" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <rect class="sunk" x="420" y="376" width="216" height="92" rx="12" stroke-width="1.5" />
  <text x="528.0" y="419.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Never sent</text>
  <text x="528.0" y="438.0" text-anchor="middle" class="muted" font-size="12">the #fragment stays in the browser</text>
  <line class="line" x1="638" y1="422" x2="666" y2="422" marker-end="url(#a)"/>
  <rect class="card" x="670" y="376" width="216" height="92" rx="12" stroke-width="1.5" />
  <text x="778.0" y="419.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Client JS</text>
  <text x="778.0" y="438.0" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">innerHTML = location.hash</text>
  <line class="line" x1="888" y1="422" x2="916" y2="422" marker-end="url(#a)"/>
  <rect class="negsoft" x="920" y="376" width="216" height="92" rx="12" stroke-width="1.5" />
  <text x="1028.0" y="419.0" text-anchor="middle" class="negink" font-size="15" font-weight="700">Runs in the tab</text>
  <text x="1028.0" y="438.0" text-anchor="middle" class="muted" font-size="12">invisible to server logs</text>
</svg>
