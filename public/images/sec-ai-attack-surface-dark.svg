<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">AI attacks: two different problems</title>
  <desc id="d">Two panels. Left, attacks on your AI features: prompt injection, direct or hidden in content the model reads; improper output handling, where model output is rendered as HTML and becomes XSS; sensitive data and system-prompt leaks; excessive agency, where tools let a manipulated model act; and unbounded consumption, where abuse runs up your bill. Right, attacks powered by AI: convincing phishing and deepfake voice or video; faster exploit development after a CVE is published; slopsquatting, where attackers register package names that AI assistants hallucinate; and attacks on AI coding agents and AI browsers through instructions hidden in repos, issues and web pages.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="520" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">AI attacks: two different problems</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Attackers target the AI features you build, and they also use AI to attack everything else faster.</text>
  <rect class="negsoft" x="40" y="100" width="545" height="390" rx="16" stroke-width="1.5" />
  <text x="64" y="132" text-anchor="start" class="negink head" font-size="12.5">ATTACKS ON YOUR AI FEATURES</text>
  <rect class="card" x="64" y="150" width="497" height="56" rx="10" stroke-width="1.5" />
  <text x="84" y="174" text-anchor="start" class="ink" font-size="15" font-weight="700">Prompt injection</text>
  <text x="84" y="194" text-anchor="start" class="muted" font-size="12.5">typed in, or hidden in pages, emails, files</text>
  <rect class="card" x="64" y="216" width="497" height="56" rx="10" stroke-width="1.5" />
  <text x="84" y="240" text-anchor="start" class="ink" font-size="15" font-weight="700">Improper output handling</text>
  <text x="84" y="260" text-anchor="start" class="muted" font-size="12.5">model output rendered as HTML = XSS</text>
  <rect class="card" x="64" y="282" width="497" height="56" rx="10" stroke-width="1.5" />
  <text x="84" y="306" text-anchor="start" class="ink" font-size="15" font-weight="700">Data &amp; system-prompt leaks</text>
  <text x="84" y="326" text-anchor="start" class="muted" font-size="12.5">secrets, other users&#x27; data, internal rules</text>
  <rect class="card" x="64" y="348" width="497" height="56" rx="10" stroke-width="1.5" />
  <text x="84" y="372" text-anchor="start" class="ink" font-size="15" font-weight="700">Excessive agency</text>
  <text x="84" y="392" text-anchor="start" class="muted" font-size="12.5">tools let a tricked model act</text>
  <rect class="card" x="64" y="414" width="497" height="56" rx="10" stroke-width="1.5" />
  <text x="84" y="438" text-anchor="start" class="ink" font-size="15" font-weight="700">Unbounded consumption</text>
  <text x="84" y="458" text-anchor="start" class="muted" font-size="12.5">abuse runs up tokens and cost</text>
  <rect class="heat" x="615" y="100" width="545" height="390" rx="16" stroke-width="1.5" />
  <text x="639" y="132" text-anchor="start" class="heatink head" font-size="12.5">ATTACKS POWERED BY AI</text>
  <rect class="card" x="639" y="150" width="497" height="56" rx="10" stroke-width="1.5" />
  <text x="659" y="174" text-anchor="start" class="ink" font-size="15" font-weight="700">AI phishing &amp; deepfakes</text>
  <text x="659" y="194" text-anchor="start" class="muted" font-size="12.5">perfect emails, cloned voices and faces</text>
  <rect class="card" x="639" y="216" width="497" height="56" rx="10" stroke-width="1.5" />
  <text x="659" y="240" text-anchor="start" class="ink" font-size="15" font-weight="700">Faster exploitation</text>
  <text x="659" y="260" text-anchor="start" class="muted" font-size="12.5">working exploits soon after a CVE</text>
  <rect class="card" x="639" y="282" width="497" height="56" rx="10" stroke-width="1.5" />
  <text x="659" y="306" text-anchor="start" class="ink" font-size="15" font-weight="700">Slopsquatting</text>
  <text x="659" y="326" text-anchor="start" class="muted" font-size="12.5">malicious packages with hallucinated names</text>
  <rect class="card" x="639" y="348" width="497" height="56" rx="10" stroke-width="1.5" />
  <text x="659" y="372" text-anchor="start" class="ink" font-size="15" font-weight="700">Attacks on AI agents</text>
  <text x="659" y="392" text-anchor="start" class="muted" font-size="12.5">hidden instructions in repos, issues, pages</text>
  <rect class="card" x="639" y="414" width="497" height="56" rx="10" stroke-width="1.5" />
  <text x="659" y="438" text-anchor="start" class="ink" font-size="15" font-weight="700">Scaled recon &amp; fraud</text>
  <text x="659" y="458" text-anchor="start" class="muted" font-size="12.5">automated probing, fake accounts, scraping</text>
</svg>
