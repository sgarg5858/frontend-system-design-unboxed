<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Same input, two sinks</title>
  <desc id="d">The same untrusted string, &lt;img src=x onerror=steal()&gt;, is written into the page in two ways. On the left, el.textContent = input: the browser shows the characters literally on screen and nothing runs. On the right, el.innerHTML = input: the browser parses it, creates an image element, the image fails to load, and its onerror handler runs steal() in your origin.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="500" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Same input, two sinks</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Text APIs keep data as data. HTML APIs parse it, and anything that parses can run code.</text>
  <rect class="heat" x="330" y="96" width="540" height="52" rx="12" stroke-width="1.5" />
  <text x="600" y="129" text-anchor="middle" class="ink mono" font-size="17" font-weight="700" xml:space="preserve">input = &quot;&lt;img src=x onerror=steal()&gt;&quot;</text>
  <path class="spos" d="M470 150 C470 190 300 180 300 214" marker-end="url(#ap)"/>
  <path class="sneg" d="M730 150 C730 190 900 180 900 214" marker-end="url(#an)"/>
  <rect class="possoft" x="60" y="218" width="480" height="250" rx="14" stroke-width="1.5" />
  <text x="300" y="256" text-anchor="middle" class="posink mono" font-size="18" font-weight="700" xml:space="preserve">el.textContent = input</text>
  <rect class="card" x="90" y="280" width="420" height="70" rx="10" stroke-width="1.5" />
  <text x="300" y="322" text-anchor="middle" class="ink mono" font-size="15" xml:space="preserve">&lt;img src=x onerror=steal()&gt;</text>
  <text x="300" y="384" text-anchor="middle" class="ink" font-size="14" font-weight="700">Shown as plain characters.</text>
  <text x="300" y="408" text-anchor="middle" class="muted" font-size="13">Nothing is parsed, nothing runs.</text>
  <text x="300" y="444" text-anchor="middle" class="posink" font-size="12.5" font-weight="700">Also safe: {{ value }} in Angular, {value} in JSX</text>
  <rect class="negsoft" x="660" y="218" width="480" height="250" rx="14" stroke-width="1.5" />
  <text x="900" y="256" text-anchor="middle" class="negink mono" font-size="18" font-weight="700" xml:space="preserve">el.innerHTML = input</text>
  <rect class="card" x="690" y="280" width="420" height="70" rx="10" stroke-width="1.5" />
  <text x="900" y="306" text-anchor="middle" class="ink mono" font-size="14" xml:space="preserve">&lt;img&gt;  →  load fails  →  onerror</text>
  <text x="900" y="332" text-anchor="middle" class="negink mono" font-size="14" font-weight="700" xml:space="preserve">steal() runs in app.example.com</text>
  <text x="900" y="384" text-anchor="middle" class="ink" font-size="14" font-weight="700">Parsed as HTML: code runs.</text>
  <text x="900" y="408" text-anchor="middle" class="muted" font-size="13">Same for outerHTML, insertAdjacentHTML,</text>
  <text x="900" y="428" text-anchor="middle" class="muted" font-size="13">document.write, eval, javascript: URLs</text>
</svg>
