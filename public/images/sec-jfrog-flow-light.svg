<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">JFrog: a checkpoint between npm and your code</title>
  <desc id="d">Left to right. A developer or CI runs npm install, with .npmrc pointing at the company Artifactory instead of the public npm registry. Artifactory has a remote repository that proxies and caches npmjs.org. Before a new package version is downloaded into the cache, JFrog Curation checks it against policies: known malicious, critical CVE, banned license, or too new; a blocked package never reaches the developer. JFrog Xray continuously scans what is in Artifactory and every build and release bundle, using watches and policies, and with Advanced Security checks whether a CVE is actually applicable (contextual analysis), and scans for secrets. Frogbot comments on pull requests and opens fix PRs. Builds that violate policy can be failed.</desc>
  <style>
    .bg{fill:#f6f4ef}.card{fill:#fffdf9;stroke:#e5e0d5}.sunk{fill:#f3f0e9}
    .ink{fill:#1c1b22}.muted{fill:#5b5866}.onacc{fill:#ffffff}
    .acc{fill:#2b5fd9}.accink{fill:#1d47ad}.accsoft{fill:#e6edfc}
    .pos{fill:#168a64}.posink{fill:#0d6a4b}.possoft{fill:#dcf2e8;stroke:#168a64}
    .neg{fill:#d24a2b}.negink{fill:#ad3417}.negsoft{fill:#fbe3da;stroke:#d24a2b}
    .heat{fill:#fcefd2;stroke:#d08a0c}.heatink{fill:#875700}.heatfill{fill:#d08a0c}
    .line{stroke:#5b5866;fill:none;stroke-width:2}.thin{stroke:#e5e0d5;fill:none;stroke-width:1.5}
    .dash{stroke:#2b5fd9;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#2b5fd9;fill:none;stroke-width:2.5}.sheat{stroke:#d08a0c;fill:none;stroke-width:2.5}
    .spos{stroke:#168a64;fill:none;stroke-width:2.5}.sneg{stroke:#d24a2b;fill:none;stroke-width:2.5}
    .edge{stroke:#2b5fd9;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#2b5fd9;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#f3f0e9}.hit{fill:#e6edfc;stroke:#2b5fd9}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#5b5866}.arrowacc{fill:#2b5fd9}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="540" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">JFrog: a checkpoint between npm and your code</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">Artifactory proxies the registry, Curation decides what may enter, Xray scans what is already inside.</text>
  <rect class="card" x="40" y="160" width="200" height="120" rx="12" stroke-width="1.5" />
  <text x="140.0" y="208.5" text-anchor="middle" class="ink" font-size="15" font-weight="700">Developer / CI</text>
  <text x="140.0" y="227.5" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">npm install</text>
  <text x="140.0" y="244.5" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">.npmrc → Artifactory</text>
  <line class="line" x1="242" y1="220" x2="300" y2="220" marker-end="url(#a)"/>
  <rect class="hit" x="304" y="110" width="520" height="330" rx="16" stroke-width="1.5" />
  <text x="324" y="140" text-anchor="start" class="accink" font-size="16" font-weight="700">JFrog Platform</text>
  <rect class="card" x="324" y="160" width="230" height="120" rx="12" stroke-width="1.5" />
  <text x="439.0" y="200.0" text-anchor="middle" class="ink" font-size="15" font-weight="700">Artifactory</text>
  <text x="439.0" y="219.0" text-anchor="middle" class="muted" font-size="12">npm-remote: proxies</text>
  <text x="439.0" y="236.0" text-anchor="middle" class="muted" font-size="12">and caches npmjs.org</text>
  <text x="439.0" y="253.0" text-anchor="middle" class="muted" font-size="12">single source of truth</text>
  <rect class="heat" x="574" y="160" width="230" height="120" rx="12" stroke-width="1.5" />
  <text x="689.0" y="200.0" text-anchor="middle" class="heatink" font-size="15" font-weight="700">Curation</text>
  <text x="689.0" y="219.0" text-anchor="middle" class="muted" font-size="12">gate before download:</text>
  <text x="689.0" y="236.0" text-anchor="middle" class="muted" font-size="12">malicious · critical CVE</text>
  <text x="689.0" y="253.0" text-anchor="middle" class="muted" font-size="12">license · too new</text>
  <rect class="card" x="324" y="300" width="480" height="120" rx="12" stroke-width="1.5" />
  <text x="564.0" y="348.5" text-anchor="middle" class="ink" font-size="15" font-weight="700">Xray (+ Advanced Security)</text>
  <text x="564.0" y="367.5" text-anchor="middle" class="muted" font-size="12">scans cache, builds, release bundles via watches &amp; policies</text>
  <text x="564.0" y="384.5" text-anchor="middle" class="muted" font-size="12">contextual analysis: is the CVE applicable? · secrets · licenses</text>
  <line class="line" x1="824" y1="220" x2="900" y2="220" marker-end="url(#a)"/>
  <rect class="negsoft" x="904" y="120" width="256" height="130" rx="12" stroke-width="1.5" />
  <text x="1032.0" y="173.5" text-anchor="middle" class="negink" font-size="15" font-weight="700">npmjs.org</text>
  <text x="1032.0" y="192.5" text-anchor="middle" class="muted" font-size="12">public registry</text>
  <text x="1032.0" y="209.5" text-anchor="middle" class="muted" font-size="12">including bad versions</text>
  <rect class="possoft" x="904" y="290" width="256" height="130" rx="12" stroke-width="1.5" />
  <text x="1032.0" y="343.5" text-anchor="middle" class="posink" font-size="15" font-weight="700">Frogbot + CI gates</text>
  <text x="1032.0" y="362.5" text-anchor="middle" class="muted" font-size="12">PR comments, fix PRs</text>
  <text x="1032.0" y="379.5" text-anchor="middle" class="muted" font-size="12">fail builds on policy</text>
  <line class="spos" x1="806" y1="360" x2="900" y2="355" marker-end="url(#ap)"/>
  <text x="600" y="480" text-anchor="middle" class="negink" font-size="13.5" font-weight="700">✕ A blocked package never reaches a laptop or CI runner, so its install script never runs.</text>
  <text x="600" y="508" text-anchor="middle" class="muted" font-size="12.5">Same pattern from other vendors: Sonatype Nexus Repository + Firewall, Cloudsmith, GitHub Packages.</text>
</svg>
