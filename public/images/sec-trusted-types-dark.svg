<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d" font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif">
  <title id="t">Trusted Types: only reviewed code reaches the sinks</title>
  <desc id="d">Two paths into innerHTML under a Trusted Types policy. Top path: code passes a plain string straight to innerHTML; the browser throws a TypeError and sends a CSP violation report, so nothing is inserted. Bottom path: code passes the string through a named policy, whose createHTML function calls a sanitizer such as DOMPurify and returns a TrustedHTML object; innerHTML accepts it. Because only policies can create trusted values, a security review only needs to look at the few policy functions instead of every innerHTML call.</desc>
  <style>
    .bg{fill:#0f1413}.card{fill:#171e1c;stroke:#2c3835}.sunk{fill:#1f2826}
    .ink{fill:#e4ece9}.muted{fill:#9aa9a4}.onacc{fill:#0f1413}
    .acc{fill:#4db3d1}.accink{fill:#8fd3e6}.accsoft{fill:#163742}
    .pos{fill:#3fc4a3}.posink{fill:#3fc4a3}.possoft{fill:#123a30;stroke:#3fc4a3}
    .neg{fill:#f07d60}.negink{fill:#f07d60}.negsoft{fill:#42221a;stroke:#f07d60}
    .heat{fill:#3d2e14;stroke:#f0ac40}.heatink{fill:#f0ac40}.heatfill{fill:#f0ac40}
    .line{stroke:#9aa9a4;fill:none;stroke-width:2}.thin{stroke:#2c3835;fill:none;stroke-width:1.5}
    .dash{stroke:#4db3d1;fill:none;stroke-width:2;stroke-dasharray:6 5}
    .sacc{stroke:#4db3d1;fill:none;stroke-width:2.5}.sheat{stroke:#f0ac40;fill:none;stroke-width:2.5}
    .spos{stroke:#3fc4a3;fill:none;stroke-width:2.5}.sneg{stroke:#f07d60;fill:none;stroke-width:2.5}
    .edge{stroke:#4db3d1;fill:none;stroke-width:1;opacity:.45}
    .stream{stroke:#4db3d1;fill:none;stroke-width:14;stroke-linecap:round;opacity:.35}
    .row{fill:#1f2826}.hit{fill:#163742;stroke:#4db3d1}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
    .head{font-size:13px;font-weight:700;letter-spacing:.08em}
    .arrowhead{fill:#9aa9a4}.arrowacc{fill:#4db3d1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowacc"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="heatfill"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="neg"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="pos"/></marker>
  </defs>
  <rect class="bg" width="1200" height="460" rx="18"/>
  <text x="40" y="52" text-anchor="start" class="ink" font-size="26" font-weight="700">Trusted Types: only reviewed code reaches the sinks</text>
  <text x="40" y="78" text-anchor="start" class="muted" font-size="15">With require-trusted-types-for &#x27;script&#x27;, the browser rejects plain strings at innerHTML and other DOM sinks.</text>
  <rect class="heat" x="40" y="120" width="250" height="90" rx="12" stroke-width="1.5" />
  <text x="165.0" y="162.75" text-anchor="middle" class="heatink" font-size="17" font-weight="700">userHtml</text>
  <text x="165.0" y="182.25" text-anchor="middle" class="muted" font-size="12.5">a plain string</text>
  <line class="sneg" x1="292" y1="165" x2="690" y2="165" marker-end="url(#an)"/>
  <text x="490" y="152" text-anchor="middle" class="negink mono" font-size="14" font-weight="700" xml:space="preserve">el.innerHTML = userHtml</text>
  <rect class="sunk" x="694" y="120" width="220" height="90" rx="12" stroke-width="1.5" />
  <text x="804.0" y="161.75" text-anchor="middle" class="ink" font-size="15" font-weight="700">innerHTML sink</text>
  <text x="804.0" y="181.25" text-anchor="middle" class="muted" font-size="12.5">checks the value type</text>
  <line class="sneg" x1="916" y1="165" x2="952" y2="165" marker-end="url(#an)"/>
  <rect class="negsoft" x="956" y="120" width="204" height="90" rx="12" stroke-width="1.5" />
  <text x="1058.0" y="161.75" text-anchor="middle" class="negink" font-size="15" font-weight="700">✕ TypeError</text>
  <text x="1058.0" y="181.25" text-anchor="middle" class="muted" font-size="12.5">+ CSP violation report</text>
  <rect class="heat" x="40" y="290" width="250" height="90" rx="12" stroke-width="1.5" />
  <text x="165.0" y="332.75" text-anchor="middle" class="heatink" font-size="17" font-weight="700">userHtml</text>
  <text x="165.0" y="352.25" text-anchor="middle" class="muted" font-size="12.5">a plain string</text>
  <line class="line" x1="292" y1="335" x2="336" y2="335" marker-end="url(#a)"/>
  <rect class="hit" x="340" y="280" width="300" height="110" rx="12" stroke-width="1.5" />
  <text x="490.0" y="315.0" text-anchor="middle" class="accink" font-size="15" font-weight="700">policy &#x27;app-html&#x27;</text>
  <text x="490.0" y="334.0" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">createHTML: (s) =&gt;</text>
  <text x="490.0" y="351.0" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">DOMPurify.sanitize(s)</text>
  <text x="490.0" y="368.0" text-anchor="middle" class="muted mono" font-size="12" xml:space="preserve">→ TrustedHTML</text>
  <line class="spos" x1="642" y1="335" x2="690" y2="335" marker-end="url(#ap)"/>
  <rect class="sunk" x="694" y="290" width="220" height="90" rx="12" stroke-width="1.5" />
  <text x="804.0" y="331.75" text-anchor="middle" class="ink" font-size="15" font-weight="700">innerHTML sink</text>
  <text x="804.0" y="351.25" text-anchor="middle" class="muted" font-size="12.5">checks the value type</text>
  <line class="spos" x1="916" y1="335" x2="952" y2="335" marker-end="url(#ap)"/>
  <rect class="possoft" x="956" y="290" width="204" height="90" rx="12" stroke-width="1.5" />
  <text x="1058.0" y="331.75" text-anchor="middle" class="posink" font-size="15" font-weight="700">✓ Inserted</text>
  <text x="1058.0" y="351.25" text-anchor="middle" class="muted" font-size="12.5">sanitized HTML only</text>
  <text x="600" y="432" text-anchor="middle" class="muted" font-size="13">Supported in all major browsers since early 2026 (Baseline). Angular has built-in Trusted Types support.</text>
</svg>
